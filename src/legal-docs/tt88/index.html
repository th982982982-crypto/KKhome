<script id="LD" type="application/json">{"meta":{"title":"Thông tư 88/2021/TT-BTC — Hướng dẫn chế độ kế toán cho các hộ kinh doanh, cá nhân kinh doanh","shortCode":"TT 88/2021","subtitle":"Chế độ kế toán hộ kinh doanh, cá nhân kinh doanh","slug":"tt88","effectiveDate":"01/01/2022","scope":"Thông tư này hướng dẫn việc lập chứng từ kế toán và ghi sổ kế toán của các hộ kinh doanh, cá nhân kinh doanh.","description":"Chế độ kế toán hộ kinh doanh, cá nhân kinh doanh","related":[]},"outline":[{"id":"tt88_1","no":1,"code":"Điều 1","title":"Điều 1. Phạm vi điều chỉnh","shortTitle":"Phạm vi điều chỉnh","chuong":"Chương I — QUY ĐỊNH CHUNG","muc":"","level":1,"content":[{"k":"p","t":"Thông tư này hướng dẫn việc lập chứng từ kế toán và ghi sổ kế toán của các hộ kinh doanh, cá nhân kinh doanh."}]},{"id":"tt88_2","no":2,"code":"Điều 2","title":"Điều 2. Đối tượng áp dụng","shortTitle":"Đối tượng áp dụng","chuong":"Chương I — QUY ĐỊNH CHUNG","muc":"","level":1,"content":[{"k":"p","t":"1. Đối tượng áp dụng Thông tư này là các hộ kinh doanh, cá nhân kinh doanh nộp thuế theo phương pháp kê khai theo quy định của pháp luật về thuế."},{"k":"p","t":"2. Các hộ kinh doanh, cá nhân kinh doanh không thuộc diện phải thực hiện chế độ kế toán nhưng có nhu cầu thực hiện chế độ kế toán theo Thông tư này thì được khuyến khích áp dụng."}]},{"id":"tt88_3","no":3,"code":"Điều 3","title":"Điều 3. Tổ chức công tác kế toán","shortTitle":"Tổ chức công tác kế toán","chuong":"Chương I — QUY ĐỊNH CHUNG","muc":"","level":1,"content":[{"k":"p","t":"1. Việc bố trí người làm kế toán của hộ kinh doanh, cá nhân kinh doanh do người đại diện hộ kinh doanh, cá nhân kinh doanh quyết định. Người đại diện hộ kinh doanh, cá nhân kinh doanh có thể bố trí cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, vợ, chồng, con đẻ, con nuôi, anh, chị, em ruột của mình làm kế toán cho hộ kinh doanh, cá nhân kinh doanh hoặc bố trí người làm quản lý, điều hành, thủ kho, thủ quỹ, người được giao nhiệm vụ thường xuyên mua, bán tài sản kiêm nhiệm làm kế toán cho hộ kinh doanh, cá nhân kinh doanh."},{"k":"p","t":"2. Hộ kinh doanh, cá nhân kinh doanh thực hiện chế độ kế toán hướng dẫn tại Thông tư này hoặc được lựa chọn áp dụng chế độ kế toán doanh nghiệp siêu nhỏ cho phù hợp với nhu cầu quản lý và đặc điểm hoạt động sản xuất kinh doanh của hộ kinh doanh, cá nhân kinh doanh."},{"k":"p","t":"3. Hộ kinh doanh, cá nhân kinh doanh được vận dụng các quy định tại Điều 41 Luật Kế toán và các Điều 9, 10, 11, 12, 13, 14, 15, 16, 17 Nghị định số 174/2016/NĐ-CP ngày 30/12/2016 để bảo quản, lưu trữ các tài liệu kế toán nhằm phục vụ cho việc xác định nghĩa vụ thuế của hộ kinh doanh, cá nhân kinh doanh với ngân sách nhà nước và công tác quản lý hộ kinh doanh, cá nhân kinh doanh của cơ quan thuế."}]},{"id":"tt88_4","no":4,"code":"Điều 4","title":"Điều 4. Chứng từ kế toán","shortTitle":"Chứng từ kế toán","chuong":"Chương II — QUY ĐỊNH CỤ THỂ","muc":"","level":1,"content":[{"k":"p","t":"1. Nội dung chứng từ kế toán, việc lập, lưu trữ và ký chứng từ kế toán của hộ kinh doanh, cá nhân kinh doanh được vận dụng theo quy định tại Điều 16, Điều 18, Điều 19 Luật Kế toán và thực hiện theo hướng dẫn cụ thể tại Phụ lục 1 “Biểu mẫu và phương pháp lập chứng từ kế toán” ban hành kèm theo Thông tư này."},{"k":"p","t":"2. Hộ kinh doanh, cá nhân kinh doanh được vận dụng các quy định tại Điều 17, Điều 18 Luật Kế toán về việc lập và lưu trữ chứng từ kế toán dưới dạng điện tử để thực hiện cho phù hợp với đặc điểm hoạt động sản xuất kinh doanh của hộ kinh doanh, cá nhân kinh doanh."},{"k":"p","t":"3. Nội dung, hình thức hóa đơn, trình tự lập, quản lý và sử dụng hóa đơn (kể cả hóa đơn điện tử) thực hiện theo quy định của pháp luật về thuế."},{"k":"p","t":"4. Hộ kinh doanh, cá nhân kinh doanh áp dụng chứng từ kế toán theo danh mục sau đây:"},{"k":"tbl","rows":[["STT","Tên chứng từ","Ký hiệu"],["I","Các chứng từ quy định tại Thông tư này",""],["1","Phiếu thu","Mẫu số 01-TT"],["2","Phiếu chi","Mẫu số 02-TT"],["3","Phiếu nhập kho","Mẫu số 03-VT"],["4","Phiếu xuất kho","Mẫu số 04-VT"],["5","Bảng thanh toán tiền lương và các khoản thu nhập của người lao động","Mẫu số 05-LĐTL"],["II","Các chứng từ quy định theo pháp luật khác",""],["1","Hóa đơn",""],["2","Giấy nộp tiền vào NSNN",""],["3","Giấy báo Nợ, Giấy báo Có của ngân hàng",""],["4","Ủy nhiệm chi",""]]},{"k":"p","t":"Mục đích sử dụng, biểu mẫu, nội dung và phương pháp lập các chứng từ kế toán quy định tại Thông tư này được thực hiện theo hướng dẫn cụ thể tại Phụ lục 1 “Biểu mẫu và phương pháp lập chứng từ kế toán” ban hành kèm theo Thông tư này."}]},{"id":"tt88_5","no":5,"code":"Điều 5","title":"Điều 5. Sổ kế toán","shortTitle":"Sổ kế toán","chuong":"Chương II — QUY ĐỊNH CỤ THỂ","muc":"","level":1,"content":[{"k":"p","t":"1. Nội dung sổ kế toán, việc mở sổ, ghi sổ, khóa sổ và lưu trữ sổ kế toán của hộ kinh doanh, cá nhân kinh doanh được vận dụng theo quy định tại Điều 24, Điều 25, Điều 26 Luật Kế toán và thực hiện theo hướng dẫn cụ thể tại Phụ lục 2 “Biểu mẫu và phương pháp ghi sổ kế toán” ban hành kèm theo Thông tư này."},{"k":"p","t":"2. Hộ kinh doanh, cá nhân kinh doanh được vận dụng các quy định về việc mở sổ, ghi sổ, khóa sổ và lưu trữ sổ kế toán trên phương tiện điện tử theo quy định tại Điều 26 Luật Kế toán để thực hiện cho phù hợp với đặc điểm hoạt động sản xuất kinh doanh của hộ kinh doanh, cá nhân kinh doanh."},{"k":"p","t":"3. Hộ kinh doanh, cá nhân kinh doanh được vận dụng các quy định về việc sửa chữa sổ kế toán tại Điều 27 Luật Kế toán để thực hiện cho phù hợp với đặc điểm hoạt động sản xuất kinh doanh của hộ kinh doanh, cá nhân kinh doanh."},{"k":"p","t":"4. Hộ kinh doanh, cá nhân kinh doanh sử dụng các sổ kế toán theo danh mục sau đây:"},{"k":"tbl","rows":[["STT","Tên sổ kế toán","Ký hiệu"],["1","Sổ chi tiết doanh thu bán hàng hóa, dịch vụ","Mẫu số S1- HKD"],["2","Sổ chi tiết vật liệu, dụng cụ, sản phẩm, hàng hóa","Mẫu số S2-HKD"],["3","Sổ chi phí sản xuất, kinh doanh","Mẫu số S3-HKD"],["4","Sổ theo dõi tình hình thực hiện nghĩa vụ thuế với NSNN","Mẫu số S4-HKD"],["5","Sổ theo dõi tình hình thanh toán tiền lương và các khoản nộp theo lương của người lao động","Mẫu số S5-HKD"],["6","Sổ quỹ tiền mặt","Mẫu số S6-HKD"],["7","Sổ tiền gửi ngân hàng","Mẫu số S7-HKD"]]},{"k":"p","t":"Mục đích sử dụng, biểu mẫu và phương pháp ghi sổ kế toán được hướng dẫn tại Phụ lục 2 “Biểu mẫu và phương pháp ghi sổ kế toán” ban hành kèm theo Thông tư này. Trường hợp hộ kinh doanh, cá nhân kinh doanh có nhiều địa điểm kinh doanh khác nhau thì hộ kinh doanh, cá nhân kinh doanh phải mở sổ kế toán để theo dõi chi tiết theo từng địa điểm kinh doanh."}]},{"id":"tt88_6","no":6,"code":"Điều 6","title":"Điều 6. Xác định doanh thu, chi phí, nghĩa vụ thuế","shortTitle":"Xác định doanh thu, chi phí, nghĩa vụ thuế","chuong":"Chương II — QUY ĐỊNH CỤ THỂ","muc":"","level":1,"content":[{"k":"p","t":"Việc xác định doanh thu, chi phí, nghĩa vụ thuế đối với từng lĩnh vực, ngành nghề kinh doanh của các hộ kinh doanh, cá nhân kinh doanh được thực hiện theo quy định của pháp luật về thuế."}]},{"id":"tt88_7","no":7,"code":"Điều 7","title":"Điều 7. Hiệu lực thi hành","shortTitle":"Hiệu lực thi hành","chuong":"Chương III — TỔ CHỨC THỰC HIỆN","muc":"","level":1,"content":[{"k":"p","t":"1. Thông tư này có hiệu lực thi hành kể từ ngày 01/01/2022."},{"k":"p","t":"2. Quyết định số 169/2000/QĐ-BTC ngày 25/10/2000 của Bộ trưởng Bộ Tài chính về ban hành chế độ kế toán hộ kinh doanh và Quyết định số 131/2002/QĐ-BTC ngày 18/10/2002  của Bộ trưởng Bộ Tài chính về sửa đổi, bổ sung chế độ kế toán hộ kinh doanh sẽ hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành."},{"k":"p","t":"3. Uỷ ban Nhân dân, Sở Tài chính, Cục Thuế các Tỉnh, Thành phố trực thuộc Trung ương có trách nhiệm triển khai hướng dẫn các hộ kinh doanh, cá nhân kinh doanh thực hiện Thông tư này."},{"k":"p","t":"4. Trong quá trình thực hiện nếu có vướng mắc đề nghị phản ánh về Bộ Tài chính để nghiên cứu giải quyết./."},{"k":"tbl","rows":[["Nơi nhận:\n- Văn phòng Chính phủ;\n- Văn phòng TW và các ban của Đảng;\n- Văn phòng Tổng bí thư;\n- Văn phòng Quốc hội;\n- Văn phòng Chủ tịch nước;\n- Viện Kiểm sát Nhân dân tối cao;\n- Toà án Nhân dân tối cao;\n- Kiểm toán Nhà nước;\n- Phòng Thương mại và Công nghiệp Việt Nam;\n- Các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ;\n- UBND các tỉnh, thành phố trực thuộc TW;\n- Sở Tài chính, Cục Thuế các tỉnh, thành phố trực thuộc TW;\n- Liên Minh Hợp tác xã Việt Nam;\n- Các đơn vị thuộc Bộ Tài chính;\n- Cục Kiểm tra văn bản (Bộ Tư pháp);\n- Vụ Pháp chế (Bộ Tài chính);\n- Website Bộ Tài chính;\n- Công báo;\n- Lưu: VT, Cục QLGS KT, KT.","KT. BỘ TRƯỞNG\nTHỨ TRƯỞNG\nTạ Anh Tuấn"]]}]}],"forms":[{"code":"01-TT","title":"PHIẾU THU","pl":"Phụ lục 1","note":""},{"code":"02-TT","title":"PHIẾU CHI","pl":"Phụ lục 1","note":""},{"code":"03-VT","title":"PHIẾU NHẬP KHO","pl":"Phụ lục 1","note":""},{"code":"04-VT","title":"PHIẾU XUẤT KHO","pl":"Phụ lục 1","note":""},{"code":"05-LDTL","title":"BẢNG THANH TOÁN TIỀN LƯƠNG VÀ CÁC KHOẢN THU NHẬP CỦA NGƯỜI LAO ĐỘNG","pl":"Phụ lục 1","note":""},{"code":"S1-HKD","title":"SỔ CHI TIẾT DOANH THU BÁN HÀNG HÓA, DỊCH VỤ","pl":"Phụ lục 2","note":""},{"code":"S2-HKD","title":"SỔ CHI TIẾT VẬT LIỆU, DỤNG CỤ, SẢN PHẨM, HÀNG HÓA","pl":"Phụ lục 2","note":""},{"code":"S3-HKD","title":"SỔ CHI PHÍ SẢN XUẤT, KINH DOANH","pl":"Phụ lục 2","note":""},{"code":"S4-HKD","title":"SỔ THEO DÕI TÌNH HÌNH THỰC HIỆN NGHĨA VỤ THUẾ VỚI NSNN","pl":"Phụ lục 2","note":""},{"code":"S5-HKD","title":"SỔ THEO DÕI TÌNH HÌNH THANH TOÁN TIỀN LƯƠNG VÀ CÁC KHOẢN NỘP THEO LƯƠNG CỦA NGƯỜI LAO ĐỘNG","pl":"Phụ lục 2","note":""},{"code":"S6-HKD","title":"SỔ QUỸ TIỀN MẶT","pl":"Phụ lục 2","note":""},{"code":"S7-HKD","title":"SỔ TIỀN GỬI NGÂN HÀNG","pl":"Phụ lục 2","note":""}],"refs":{"tt88_1":[{"kind":"related","targetSlug":"tt152","targetAnchor":"tt152_1","label":"TT 152/2025/TT-BTC — Chế độ kế toán HKD mới (thay thế TT 88 từ 01/01/2026)"},{"kind":"related","targetSlug":"luat-38","targetAnchor":"luat-38_1","label":"Luật Quản lý thuế 38/2019/QH14 — Căn cứ pháp lý"}],"tt88_4":[{"kind":"related","targetSlug":null,"label":"Phụ lục 1 — 05 biểu mẫu chứng từ kế toán kèm phương pháp lập","note":"(Phiếu thu, Phiếu chi, Phiếu nhập kho, Phiếu xuất kho, Bảng thanh toán lương)"}],"tt88_5":[{"kind":"related","targetSlug":null,"label":"Phụ lục 2 — 07 biểu mẫu sổ kế toán kèm phương pháp ghi sổ","note":"(Mẫu S1-HKD đến S7-HKD)"},{"kind":"related","targetSlug":"tt152","targetAnchor":"tt152_3","label":"TT 152/2025 — Điều 3: Sổ kế toán HKD áp dụng từ 01/01/2026"}],"tt88_7":[{"kind":"replaces","targetSlug":"tt152","targetAnchor":"tt152_8","label":"Được thay thế bởi Thông tư 152/2025/TT-BTC từ ngày 01/01/2026"},{"kind":"replaces","targetSlug":null,"label":"Bãi bỏ Quyết định số 169/2000/QĐ-BTC và Quyết định số 131/2002/QĐ-BTC"}]},"details":{},"summaries":{"tt88_1":{"tldr":"Quy định phạm vi điều chỉnh về lập chứng từ kế toán và ghi sổ kế toán của các hộ kinh doanh, cá nhân kinh doanh.","points":["Áp dụng cho việc lập chứng từ kế toán và ghi sổ kế toán của hộ kinh doanh, cá nhân kinh doanh."]},"tt88_2":{"tldr":"Xác định đối tượng áp dụng là các hộ kinh doanh, cá nhân kinh doanh nộp thuế theo phương pháp kê khai hoặc các phương pháp khác có nhu cầu thực hiện.","points":["Hộ kinh doanh, cá nhân kinh doanh nộp thuế theo phương pháp kê khai theo quy định của pháp luật về thuế.","Hộ kinh doanh, cá nhân kinh doanh nộp thuế theo phương pháp khác có nhu cầu thực hiện chế độ kế toán theo Thông tư này khuyến khích áp dụng."]},"tt88_3":{"tldr":"Quy định về việc tổ chức công tác kế toán của hộ kinh doanh, cá nhân kinh doanh.","points":["Người đại diện hộ kinh doanh, cá nhân kinh doanh bố trí người làm kế toán hoặc thuê dịch vụ làm kế toán.","Được bố trí người thân (cha, mẹ, vợ, chồng, con, anh chị em ruột) hoặc người kiêm nhiệm làm quản lý, thủ kho, thủ quỹ làm kế toán.","Bảo quản, lưu trữ tài liệu kế toán theo quy định của Luật Kế toán."]},"tt88_4":{"tldr":"Quy định nội dung, biểu mẫu và phương pháp lập chứng từ kế toán cho hộ kinh doanh.","points":["Nội dung chứng từ kế toán phải tuân thủ Điều 16 Luật Kế toán.","Áp dụng 05 biểu mẫu chứng từ tại Phụ lục 1: Phiếu thu (01-TT), Phiếu chi (02-TT), Phiếu nhập kho (03-VT), Phiếu xuất kho (04-VT), Bảng thanh toán tiền lương và thu nhập người lao động (05-LĐTL).","Chứng từ kế toán có thể lập dưới dạng điện tử hoặc trên giấy, đảm bảo tính hợp pháp, chính xác, kịp thời."]},"tt88_5":{"tldr":"Quy định nội dung, hình thức và hệ thống 07 sổ kế toán của hộ kinh doanh tại Phụ lục 2.","points":["Áp dụng 07 biểu mẫu sổ kế toán: S1-HKD (Doanh thu), S2-HKD (Vật liệu, dụng cụ, sản phẩm, hàng hóa), S3-HKD (Chi phí SXKD), S4-HKD (Nghĩa vụ thuế với NSNN), S5-HKD (Thanh toán tiền lương và các khoản nộp theo lương), S6-HKD (Quỹ tiền mặt), S7-HKD (Tiền gửi ngân hàng).","Sổ kế toán phải mở vào đầu kỳ kế toán năm hoặc ngày bắt đầu hoạt động, ghi chép liên tục, khóa sổ cuối kỳ.","Được phép ghi sổ trên phương tiện điện tử nhưng phải in ra giấy khi kết thúc kỳ kế toán năm hoặc khi có yêu cầu kiểm tra."]},"tt88_6":{"tldr":"Quy định về việc xác định doanh thu, chi phí và nghĩa vụ thuế của hộ kinh doanh, cá nhân kinh doanh.","points":["Doanh thu, chi phí và nghĩa vụ thuế được xác định theo quy định của pháp luật về thuế quản lý đối với hộ kinh doanh, cá nhân kinh doanh.","Căn cứ số liệu trên chứng từ và sổ kế toán để kê khai, tính và nộp các loại thuế (GTGT, TNCN,...) theo quy định."]},"tt88_7":{"tldr":"Quy định hiệu lực thi hành từ ngày 01/01/2022 và bãi bỏ các quy định cũ trước đây.","points":["Có hiệu lực thi hành kể từ ngày 01/01/2022.","Bãi bỏ Quyết định số 169/2000/QĐ-BTC ngày 25/10/2000 và Quyết định số 131/2002/QĐ-BTC ngày 18/10/2002 của Bộ Tài chính.","Ủy ban nhân dân, Sở Tài chính, Cục Thuế các tỉnh thành phố có trách nhiệm triển khai hướng dẫn."]}}}</script>

/*CD-JS-START*/
function __cdData(){return (typeof window!=='undefined'&&window.__CDD__)?window.__CDD__:((typeof D!=='undefined'&&D.details)||{});}
function applyDetails(id,html){var arr=__cdData()[id];if(!arr||!arr.length)return html;for(var ix=0;ix<arr.length;ix++){var e=arr[ix];if(!e||!e.match)continue;var i=html.indexOf(e.match);if(i<0)continue;var pre='<span class="clause-hl" onclick="openDetail(\''+id+'\','+ix+');return false">';html=html.slice(0,i)+pre+html.slice(i,i+e.match.length)+'<span class="cd-ico">ⓘ</span></span>'+html.slice(i+e.match.length);}return html;}
function openDetail(id,ix){var en=(__cdData()[id]||[])[ix];if(!en)return;document.getElementById('cdTitle').textContent=en.title||'';document.getElementById('cdSummary').innerHTML=en.summary||'';var lh='';(en.links||[]).forEach(function(r){if(r.targetSlug){lh+='<a class="cd-link" target="_top" href="/legal/'+r.targetSlug+(r.targetAnchor?'?anchor='+r.targetAnchor:'')+'">'+e(r.label)+' →</a>'}else{lh+='<div class="cd-link note">'+e(r.label)+'</div>'}});document.getElementById('cdLinks').innerHTML=lh;document.getElementById('cdBackdrop').classList.add('show');}
function closeDetail(){var b=document.getElementById('cdBackdrop');if(b)b.classList.remove('show');}
if(typeof document!=='undefined')document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeDetail();});
/*CD-JS-END*/
function show(id){
  var a=null,o=D.outline||[];
  for(var i=0;i<o.length;i++){if(o[i].id===id){a=o[i];break;}}
  if(!a)return;
  cur=id;
  tab('main',document.getElementById('tab-main'));
  buildSb(document.getElementById('q').value);
  var bc=[a.chuong,a.muc,a.code].filter(Boolean).map(e).join(' › ');
  var h='<div class="bc">'+bc+'</div><div class="at">'+e(a.title)+'</div>';
  h+='<div class="ac">'+applyDetails(id,autolink(renderContent(a.content,'')))+'</div>';
  h+=renderRefs(id);
  document.getElementById('av').className='';
  document.getElementById('av').innerHTML=h;
  var n=document.querySelector('.ni[data-id="'+id+'"]');if(n)n.scrollIntoView({block:'nearest'});
  if(history.replaceState)history.replaceState(null,'','#'+id);
}
function search(v){buildSb(v);}
function tab(t,btn){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on')});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on')});
  document.getElementById('s-'+t).classList.add('on');
  if(btn)btn.classList.add('on');
  if(t==='home')buildHome();if(t==='summary')buildSummary();
  if(t==='forms'&&typeof buildForms==='function')buildForms();
}
function buildHome(){
  var m=D.meta||{},o=D.outline||[];
  var chs={};o.forEach(function(a){if(a.chuong)chs[a.chuong]=1});
  var h='<h1 class="ht">'+e(m.title||'')+'</h1>';
  if(m.scope)h+='<p style="color:#475569">'+e(m.scope)+'</p>';
  h+='<div class="hgrid">';
  h+='<div class="sc"><b>'+o.length+'</b><span>Điều</span></div>';
  h+='<div class="sc"><b>'+Object.keys(chs).length+'</b><span>Chương</span></div>';
  if(m.effectiveDate)h+='<div class="sc"><b style="font-size:15px">'+e(m.effectiveDate)+'</b><span>Hiệu lực</span></div>';
  h+='</div>';
  if(m.description)h+='<div class="db">'+e(m.description)+'</div>';
  if(m.related&&m.related.length){h+='<div style="margin-top:10px">';m.related.forEach(function(r){h+='<span class="tag">'+e(r)+'</span>'});h+='</div>';}
  document.getElementById('s-home').innerHTML=h;
}
function buildForms(){
  var el=document.getElementById('s-forms');
  if(!D.forms||!D.forms.length){el.innerHTML='<div class="hint">Không có biểu mẫu.</div>';return;}
  var h='<div class="db">📥 '+D.forms.length+' biểu mẫu — tải bản Word (.docx) hoặc Excel (.xlsx).</div>',pl='';
  D.forms.forEach(function(f){
    if(f.pl&&f.pl!==pl){h+='<div class="ns">'+e(f.pl)+'</div>';pl=f.pl;}
    h+='<div class="form-row"><span class="form-code">'+e(f.code)+'</span><span class="form-title">'+e(f.title)+'</span>'+
       '<span class="dl-grp"><a class="dl-btn" data-doc="'+D.meta.slug+'" data-file="'+e(f.code)+'" data-type="word">⬇ Word</a>'+
       '<a class="dl-btn dl-x" data-doc="'+D.meta.slug+'" data-file="'+e(f.code)+'" data-type="excel">⬇ Excel</a></span>'+
       (f.note?'<span class="form-note">'+e(f.note)+'</span>':'')+'</div>';
  });
  el.innerHTML=h;
}
document.addEventListener('click',async function(ev){
  var btn=ev.target.closest('a.dl-btn');if(!btn||btn.classList.contains('loading'))return;ev.preventDefault();
  var doc=btn.getAttribute('data-doc'),file=btn.getAttribute('data-file'),type=btn.getAttribute('data-type'),orig=btn.innerHTML;
  btn.classList.add('loading');btn.innerHTML='<span class="sp"></span> ...';
  try{
    var res=await fetch('/api/legal/forms?doc='+encodeURIComponent(doc)+'&file='+encodeURIComponent(file)+'&type='+type,{credentials:'include'});
    if(!res.ok)throw 0;var blob=await res.blob();var a=document.createElement('a');var u=URL.createObjectURL(blob);
    a.href=u;a.download=file+(type==='excel'?'.xlsx':'.docx');document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},2000);
  }catch(_){alert('Chưa có file biểu mẫu này hoặc lỗi tải. File có thể chưa được upload lên hệ thống.');}
  finally{setTimeout(function(){btn.innerHTML=orig;btn.classList.remove('loading')},700);}
});
/*SUM-JS-START*/
function srcLen(a){var n=0;(a.content||[]).forEach(function(b){if(b.k==='p')n+=(b.t||'').length;else if(b.k==='tbl')(b.rows||[]).forEach(function(r){n+=r.join(' ').length})});return n;}
function summaryHtml(a,s){
  if(s&&(s.tldr||(s.points&&s.points.length))){
    var h='';
    if(s.tldr)h+='<p class="sum-tldr">'+e(s.tldr)+'</p>';
    if(s.points&&s.points.length){h+='<ul class="sum-pts">';s.points.forEach(function(p){h+='<li>'+e(p)+'</li>'});h+='</ul>';}
    return h;
  }
  // Chưa có tóm tắt: Điều ngắn (<250 ký tự) → trích nguyên văn; Điều dài → chờ tóm tắt
  var L=srcLen(a);
  if(L>0&&L<250)return '<div class="sum-verbatim"><span class="sum-vlabel">Điều ngắn — trích nguyên văn</span>'+renderContent(a.content||[],'')+'</div>';
  return '<p class="sum-empty">— Chưa có tóm tắt —</p>';
}
function buildSummary(){
  var m=D.meta||{},o=D.outline||[],sm=D.summaries||{};
  var chs={};o.forEach(function(a){if(a.chuong)chs[a.chuong]=1});
  var h='<div class="sum-wrap"><h1 class="sum-h1">'+e(m.title||'')+'</h1>';
  if(m.scope)h+='<p class="sum-scope">'+e(m.scope)+'</p>';
  h+='<div class="sum-grid"><div class="sum-stat"><b>'+o.length+'</b><span>Điều</span></div><div class="sum-stat"><b>'+Object.keys(chs).length+'</b><span>Chương</span></div>'+(m.effectiveDate?'<div class="sum-stat"><b>'+e(m.effectiveDate)+'</b><span>Hiệu lực</span></div>':'')+'</div>';
  if(m.related&&m.related.length){h+='<div class="sum-rel">';m.related.forEach(function(r){h+='<span class="sum-tag">'+e(r)+'</span>'});h+='</div>';}
  var lastC='',lastM='';
  o.forEach(function(a){
    if((a.chuong||'')!==lastC){lastC=a.chuong||'';lastM='';if(lastC)h+='<div class="sum-ch">'+e(lastC)+'</div>';}
    if((a.muc||'')!==lastM){lastM=a.muc||'';if(lastM)h+='<div class="sum-mu">'+e(lastM)+'</div>';}
    h+='<div class="sum-art" id="sum-'+a.id+'"><div class="sum-head"><span class="sum-code">'+e(a.code)+'</span>'+(a.shortTitle?'<span class="sum-title">'+e(a.shortTitle)+'</span>':'')+'<a class="sum-go" onclick="goOriginal(\''+a.id+'\');return false">Xem nguyên bản →</a></div>'+summaryHtml(a,sm[a.id])+'</div>';
  });
  h+='</div>';
  document.getElementById('s-summary').innerHTML=h;
}
function goOriginal(id){show(id);}
/*SUM-JS-END*/
function initHash(){
  var id=(location.hash||'').replace('#','');
  var ok=(D.outline||[]).some(function(a){return a.id===id});
  buildSb('');buildSummary();
  if(ok)show(id);else if(!D.summaries||!Object.keys(D.summaries).length){if((D.outline||[]).length)show(D.outline[0].id);}
}
initHash();
</script>
