 bổ thuế trong kỳ tính thuế chuyển tiếp."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 04 / 45"}]},{"id":"st_1","label":"Câu 1","shortTitle":"Doanh nghiệp có doanh thu của hoạt động 12 tháng năm 2026 là 900 triệu đồng có được miễn thuế TNDN không?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 1: Doanh nghiệp có doanh thu của hoạt động 12 tháng năm 2026 là 900 triệu đồng có được miễn thuế TNDN không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC MIỄN THUẾ. Doanh nghiệp được miễn thuế TNDN hoàn toàn nếu tổng doanh thu năm từ 01 tỷ đồng trở xuống."}]},{"id":"st_2","label":"Câu 2","shortTitle":"Doanh thu 01 tỷ đồng để xác định miễn thuế bao gồm những khoản nào?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 2: Doanh thu 01 tỷ đồng để xác định miễn thuế bao gồm những khoản nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• BAO GỒM TOÀN BỘ DOANH THU. Doanh thu làm căn cứ xác định miễn thuế bao gồm doanh thu bán hàng, cung cấp dịch vụ (đã loại bỏ các khoản giảm trừ doanh thu như chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại), doanh thu hoạt động tài chính và các khoản thu nhập khác trên Phụ lục kết quả sản xuất kinh doanh."}]},{"id":"st_3","label":"Câu 3","shortTitle":"Công ty con của một tập đoàn có doanh thu 800 triệu đồng có được miễn thuế không?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 3: Công ty con của một tập đoàn có doanh thu 800 triệu đồng có được miễn thuế không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC MIỄN THUẾ. Quy định miễn thuế này tuyệt đối không áp dụng đối với công ty con hoặc doanh nghiệp có quan hệ liên kết với doanh nghiệp không đáp ứng điều kiện miễn thuế nhằm tránh việc chuyển dịch lợi nhuận bất hợp pháp."}]},{"id":"st_4","label":"Câu 4","shortTitle":"Doanh nghiệp mới thành lập dự kiến doanh thu dưới 1 tỷ có cần tạm nộp thuế quý không?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 4: Doanh nghiệp mới thành lập dự kiến doanh thu dưới 1 tỷ có cần tạm nộp thuế quý không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG CẦN TẠM NỘP. Nếu dự kiến tổng doanh thu trong kỳ tính thuế cả năm không quá 01 tỷ đồng thì doanh nghiệp không phải thực hiện nghĩa vụ tạm nộp thuế TNDN theo quý."}]},{"id":"st_5","label":"Câu 5","shortTitle":"Nếu doanh thu thực tế cuối năm vượt 1 tỷ (so với dự kiến dưới 1 tỷ), doanh nghiệp mới thành lập có bị phạt không?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 5: Nếu doanh thu thực tế cuối năm vượt 1 tỷ (so với dự kiến dưới 1 tỷ), doanh nghiệp mới thành lập có bị phạt không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG BỊ PHẠT CHẬM NỘP. Doanh nghiệp chỉ cần thực hiện kê khai, quyết toán thuế theo đúng quy định thực tế khi kết thúc năm và không bị cơ quan thuế tính tiền chậm nộp đối với số thuế chưa tạm nộp trong năm."}]},{"id":"st_6","label":"Câu 6","shortTitle":"Doanh nghiệp có tổng doanh thu năm 2025 từ 1 tỷ đồng trở xuống, nộp thừa thuế TNDN quý I/2026 có được bù trừ không?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 6: Doanh nghiệp có tổng doanh thu năm 2025 từ 1 tỷ đồng trở xuống, nộp thừa thuế TNDN quý I/2026 có được bù trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC BÙ TRỪ HOẶC HOÀN TRẢ. Số thuế nộp thừa này sẽ được tự động bù trừ vào số thuế phải nộp của các quý tiếp theo hoặc được hoàn trả trực tiếp theo quy định của pháp luật về quản lý thuế."}]},{"id":"st_7","label":"Câu 7","shortTitle":"Kỳ tính thuế năm 2025 kết thúc vào 31/03/2026 mà doanh nghiệp đáp ứng điều kiện quy định tại","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 7: Kỳ tính thuế năm 2025 kết thúc vào 31/03/2026 mà doanh nghiệp đáp ứng điều kiện quy định tại"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC MIỄN THUẾ CHO PHẦN THỜI GIAN THUỘC NĂM 2026. Doanh nghiệp được miễn thuế TNDN cho phần thời gian tính từ ngày 01/01/2026 đến hết kỳ tính thuế đó nếu đáp ứng điều kiện tổng doanh thu quy đổi cả năm không vượt quá 1 tỷ đồng."}]},{"id":"st_8","label":"Câu 8","shortTitle":"Công thức tính thuế miễn cho năm chuyển tiếp 2026 được xác định như thế nào?","chuong":"Chủ đề 01 — Miễn thuế DN siêu nhỏ & chuyển tiếp","content":[{"k":"h3","t":"CÂU 8: Công thức tính thuế miễn cho năm chuyển tiếp 2026 được xác định như thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ÁP DỤNG CÔNG THỨC PHÂN BỔ THEO THÁNG. Thuế TNDN được miễn = (Thuế TNDN năm 2025 ÷ 12) × Số tháng thuộc năm 2026 * DN thành lập mới: thay 12 bằng số tháng hoạt động thực tế."}]},{"id":"cd_2","label":"Chủ đề 02","shortTitle":"Tổng quan: Thuế suất theo quy mô doanh thu & phương pháp xác định","chuong":"Chủ đề 02 — Thuế suất theo quy mô doanh thu","content":[{"k":"h3","t":"Tổng quan Thuế suất theo quy mô doanh thu & phương pháp xác định"},{"k":"p","t":"Nghị định số 320/2025/NĐ-CP thiết lập biểu thuế suất theo quy mô doanh thu nhằm hỗ trợ doanh nghiệp nhỏ và vừa. Mức 15% áp dụng khi tổng doanh thu năm không quá 03 tỷ đồng; mức 17% áp dụng khi doanh thu trên 03 tỷ đến không quá 50 tỷ đồng."},{"k":"p","t":"Căn cứ xác định là tổng doanh thu của kỳ tính thuế năm trước liền kề trên hồ sơ quyết toán. Nếu năm trước hoạt động không đủ 12 tháng, doanh thu được quy đổi theo năm trước khi chọn thuế suất."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 08 / 45"}]},{"id":"st_9","label":"Câu 9","shortTitle":"Doanh nghiệp có tổng doanh thu năm 2,8 tỷ đồng (không quá 3 tỷ đồng) áp dụng mức thuế suất bao nhiêu?","chuong":"Chủ đề 02 — Thuế suất theo quy mô doanh thu","content":[{"k":"h3","t":"CÂU 9: Doanh nghiệp có tổng doanh thu năm 2,8 tỷ đồng (không quá 3 tỷ đồng) áp dụng mức thuế suất bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 15%. Doanh nghiệp có tổng doanh thu năm từ 03 tỷ đồng trở xuống được áp dụng mức thuế suất ưu đãi là 15%."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 2 Điều 11 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_10","label":"Câu 10","shortTitle":"Doanh nghiệp có tổng doanh thu năm 20 tỷ đồng (trên 3 tỷ đến không quá 50 tỷ) áp dụng mức thuế suất bao nhiêu?","chuong":"Chủ đề 02 — Thuế suất theo quy mô doanh thu","content":[{"k":"h3","t":"CÂU 10: Doanh nghiệp có tổng doanh thu năm 20 tỷ đồng (trên 3 tỷ đến không quá 50 tỷ) áp dụng mức thuế suất bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 17%. Doanh nghiệp có tổng doanh thu năm từ trên 03 tỷ đồng đến không quá 50 tỷ đồng được áp dụng mức thuế suất ưu đãi là 17%."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 3 Điều 11 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_11","label":"Câu 11","shortTitle":"Căn cứ xác định doanh thu để hưởng thuế suất 15% và 17% là năm nào?","chuong":"Chủ đề 02 — Thuế suất theo quy mô doanh thu","content":[{"k":"h3","t":"CÂU 11: Căn cứ xác định doanh thu để hưởng thuế suất 15% và 17% là năm nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• NĂM TRƯỚC LIỀN KỀ. Căn cứ xác định là tổng doanh thu của kỳ tính thuế năm trước liền kề được thể hiện trên hồ sơ quyết toán thuế TNDN."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 4 Điều 11 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_12","label":"Câu 12","shortTitle":"Nếu năm trước công ty hoạt động dưới 12 tháng thì xác định doanh thu thế nào?","chuong":"Chủ đề 02 — Thuế suất theo quy mô doanh thu","content":[{"k":"h3","t":"CÂU 12: Nếu năm trước công ty hoạt động dưới 12 tháng thì xác định doanh thu thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• QUY ĐỔI DOANH THU THEO NĂM. Doanh thu quy đổi = Doanh thu thực tế ÷ Số tháng hoạt động × 12"},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 4 Điều 11 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_3","label":"Chủ đề 03","shortTitle":"Tổng quan: Thời điểm và phương pháp xác định doanh thu tính thuế","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"Tổng quan Thời điểm và phương pháp xác định doanh thu tính thuế"},{"k":"p","t":"Xác định đúng thời điểm ghi nhận doanh thu quyết định tính trung thực của báo cáo tài chính và nghĩa vụ thuế TNDN. Thời điểm với hàng hóa là lúc chuyển giao quyền sở hữu/sử dụng; với dịch vụ là lúc hoàn thành cung ứng hoặc hoàn thành từng phần."},{"k":"p","t":"Doanh nghiệp nộp GTGT theo phương pháp khấu trừ lấy doanh thu chưa gồm GTGT; phương pháp trực tiếp lấy doanh thu đã gồm GTGT. Các trường hợp đại lý, xây dựng, kinh doanh bất động sản có quy tắc riêng."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 11 / 45"}]},{"id":"st_13","label":"Câu 13","shortTitle":"Thời điểm xác định doanh thu đối với hoạt động bán hàng hóa?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 13: Thời điểm xác định doanh thu đối với hoạt động bán hàng hóa?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THỜI ĐIỂM CHUYỂN GIAO QUYỀN. Là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua, không phân biệt đã thu được tiền hay chưa."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 2 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_14","label":"Câu 14","shortTitle":"Thời điểm xác định doanh thu đối với hoạt động cung ứng dịch vụ?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 14: Thời điểm xác định doanh thu đối với hoạt động cung ứng dịch vụ?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THỜI ĐIỂM HOÀN THÀNH CUNG ỨNG. Là thời điểm hoàn thành việc cung ứng dịch vụ hoặc hoàn thành từng phần việc cung ứng dịch vụ cho người mua, không phân biệt đã thu được tiền hay chưa."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 2 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_15","label":"Câu 15","shortTitle":"Doanh nghiệp nộp thuế GTGT trực tiếp thì doanh thu tính thuế TNDN xác định thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 15: Doanh nghiệp nộp thuế GTGT trực tiếp thì doanh thu tính thuế TNDN xác định thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• BAO GỒM CẢ THUẾ GTGT. Đối với doanh nghiệp nộp thuế GTGT theo phương pháp trực tiếp, doanh thu tính thuế TNDN là doanh thu đã bao gồm cả thuế GTGT."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 1 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_16","label":"Câu 16","shortTitle":"Doanh nghiệp nộp thuế GTGT khấu trừ thì doanh thu tính thuế TNDN xác định thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 16: Doanh nghiệp nộp thuế GTGT khấu trừ thì doanh thu tính thuế TNDN xác định thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG BAO GỒM THUẾ GTGT. Đối với doanh nghiệp nộp thuế GTGT theo phương pháp khấu trừ, doanh thu tính thuế TNDN là doanh thu chưa bao gồm thuế GTGT."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 1 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_17","label":"Câu 17","shortTitle":"Bán hàng trả góp thì tính doanh thu tại thời điểm nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 17: Bán hàng trả góp thì tính doanh thu tại thời điểm nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TÍNH THEO GIÁ BÁN TRẢ MỘT LẦN. Doanh thu được xác định theo giá bán hàng hóa trả một lần tại thời điểm chuyển giao hàng, hoàn toàn không bao gồm phần lãi trả chậm, trả góp."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_18","label":"Câu 18","shortTitle":"Doanh nghiệp giao hàng hóa cho các đại lý bán đúng giá hưởng hoa hồng thì doanh thu là gì?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 18: Doanh nghiệp giao hàng hóa cho các đại lý bán đúng giá hưởng hoa hồng thì doanh thu là gì?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TOÀN BỘ DOANH THU BÁN HÀNG. Doanh thu tính thuế TNDN của doanh nghiệp giao hàng cho đại lý là tổng số tiền bán hàng hóa thực tế phát sinh, chưa trừ đi các khoản chi phí hoa hồng."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết c1 khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_19","label":"Câu 19","shortTitle":"Bên nhận làm đại lý bán hàng đúng giá hưởng hoa hồng tính doanh thu thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 19: Bên nhận làm đại lý bán hàng đúng giá hưởng hoa hồng tính doanh thu thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TIỀN HOA HỒNG ĐƯỢC HƯỞNG. Doanh thu của bên nhận làm đại lý chỉ bao gồm phần tiền hoa hồng thực tế được hưởng theo thỏa thuận trong hợp đồng đại lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết c2 khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_20","label":"Câu 20","shortTitle":"Doanh nghiệp cho thuê tài sản thu tiền trước nhiều năm có được lựa chọn phương pháp tính doanh thu không?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 20: Doanh nghiệp cho thuê tài sản thu tiền trước nhiều năm có được lựa chọn phương pháp tính doanh thu không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC LỰA CHỌN PHƯƠNG PHÁP. Doanh nghiệp được chọn phân bổ doanh thu đều cho số năm trả tiền trước hoặc tính gộp toàn bộ vào doanh thu của năm thực tế thu tiền."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm đ khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_21","label":"Câu 21","shortTitle":"Hoạt động vận tải quốc tế xác định doanh thu tại Việt Nam thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 21: Hoạt động vận tải quốc tế xác định doanh thu tại Việt Nam thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TOÀN BỘ DOANH THU VẬN CHUYỂN. Là toàn bộ doanh thu phát sinh từ việc vận chuyển hành khách, hàng hóa từ cảng Việt Nam đi nước ngoài trong kỳ tính thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm i khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_22","label":"Câu 22","shortTitle":"Xây dựng lắp đặt không bao thầu nguyên vật liệu tính doanh thu thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 22: Xây dựng lắp đặt không bao thầu nguyên vật liệu tính doanh thu thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG GỒM GIÁ TRỊ NGUYÊN VẬT LIỆU. Doanh thu tính thuế chỉ tính trên giá trị phần xây dựng, lắp đặt thực tế thực hiện, hoàn toàn loại trừ giá trị nguyên vật liệu, máy móc thiết bị do chủ đầu tư cung cấp."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết k2 khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_23","label":"Câu 23","shortTitle":"Doanh thu kinh doanh trò chơi có thưởng (casino) xác định thế nào?","chuong":"Chủ đề 03 — Thời điểm & phương pháp tính doanh thu","content":[{"k":"h3","t":"CÂU 23: Doanh thu kinh doanh trò chơi có thưởng (casino) xác định thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• DOANH THU THUẦN SAU TRẢ THƯỞNG. Được xác định bằng tổng số tiền thu được từ hoạt động này (đã bao gồm cả thuế tiêu thụ đặc biệt) trừ đi tổng số tiền thực tế đã trả thưởng cho khách chơi."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm n khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_4","label":"Chủ đề 04","shortTitle":"Tổng quan: Chi phí được trừ & hạ ngưỡng thanh toán không dùng tiền mặt xuống 5 triệu đồng","chuong":"Chủ đề 04 — Điều kiện chi phí & thanh toán tiền mặt","content":[{"k":"h3","t":"Tổng quan Chi phí được trừ & hạ ngưỡng thanh toán không dùng tiền mặt xuống 5 triệu đồng"},{"k":"p","t":"Chi phí được trừ phải đáp ứng điều kiện phát sinh thực tế, liên quan đến hoạt động sản xuất kinh doanh, có hóa đơn chứng từ hợp pháp. Ngưỡng thanh toán không dùng tiền mặt đã được hạ xuống 5 triệu đồng."},{"k":"p","t":"Giao dịch từ 5 triệu đồng trở lên nếu thanh toán bằng tiền mặt sẽ không được tính vào chi phí được trừ. Doanh nghiệp cần rà soát quy trình mua hàng và thanh toán để tránh bị loại chi phí khi quyết toán."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 15 / 45"}]},{"id":"st_24","label":"Câu 24","shortTitle":"Khoản chi bằng tiền mặt 6 triệu đồng có được trừ khi tính thuế TNDN không?","chuong":"Chủ đề 04 — Điều kiện chi phí & thanh toán tiền mặt","content":[{"k":"h3","t":"CÂU 24: Khoản chi bằng tiền mặt 6 triệu đồng có được trừ khi tính thuế TNDN không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ. Khoản chi có giá trị từ 05 triệu đồng trở lên bắt buộc phải thực hiện bằng hình thức thanh toán không dùng tiền mặt mới được tính là chi phí hợp lý được trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm c khoản 1 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_25","label":"Câu 25","shortTitle":"Mua hàng của một người bán nhiều lần trong ngày, mỗi lần 2 triệu (tổng 6 triệu) bằng tiền mặt được không?","chuong":"Chủ đề 04 — Điều kiện chi phí & thanh toán tiền mặt","content":[{"k":"h3","t":"CÂU 25: Mua hàng của một người bán nhiều lần trong ngày, mỗi lần 2 triệu (tổng 6 triệu) bằng tiền mặt được không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ TIỀN MẶT. Nếu tổng giá trị mua hàng của một nhà cung cấp trong cùng một ngày từ 05 triệu đồng trở lên thì bắt buộc phải thực hiện chuyển khoản để bảo vệ quyền lợi khấu trừ chi phí."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết c1 khoản 1 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_5","label":"Chủ đề 05","shortTitle":"Tổng quan: Khấu trừ bổ sung R&D 200%, Quỹ KH&CN & chi phí cộng đồng","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"Tổng quan Khấu trừ bổ sung R&D 200%, Quỹ KH&CN & chi phí cộng đồng"},{"k":"p","t":"Chính sách thuế khuyến khích đầu tư vào nghiên cứu khoa học, đổi mới sáng tạo và phát triển cộng đồng. Chi phí R&D được khấu trừ bổ sung tối đa 200%; nhiều khoản tài trợ, phúc lợi và chi phục hồi môi trường được trừ khi có hồ sơ đầy đủ."},{"k":"p","t":"Doanh nghiệp cần lưu trữ thuyết minh dự án, hóa đơn thiết bị thí nghiệm và danh sách nhân sự tham gia để chứng minh khi thanh tra. Thiếu hồ sơ là nguyên nhân phổ biến bị loại chi phí."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 18 / 45 CHỦ ĐỀ 05 / CHI PHÍ ĐƯỢC TRỪ — KHUYẾN KHÍCH ĐẦU TƯ, NGHIÊN CỨU KHOA HỌC VÀ PHÁT TRIỂN CỘNGĐỒNG PHẦNV"}]},{"id":"st_26","label":"Câu 26","shortTitle":"Chi phí bổ sung đối với hoạt động Nghiên cứu và Phát triển (R&D) được trừ tối đa bao nhiêu?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 26: Chi phí bổ sung đối với hoạt động Nghiên cứu và Phát triển (R&D) được trừ tối đa bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA 200% CHI PHÍ THỰC TẾ. Doanh nghiệp được tính vào chi phí được trừ tối đa không quá 200% chi phí thực tế phát sinh hợp pháp cho hoạt động R&D."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết a1 khoản 1 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_27","label":"Câu 27","shortTitle":"Điều kiện kết quả kinh doanh để hưởng mức trừ 200% chi phí R&D?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 27: Điều kiện kết quả kinh doanh để hưởng mức trừ 200% chi phí R&D?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• DOANH NGHIỆP KHÔNG BỊ LỖ. Việc áp dụng phần chi bổ sung khuyến khích chỉ được thực hiện khi đảm bảo sau khi trừ, kết quả kinh doanh cuối cùng của doanh nghiệp không bị lỗ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết a2 khoản 1 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_28","label":"Câu 28","shortTitle":"Điều kiện để dự án đầu tư mở rộng được hưởng ưu đãi thuế (về vốn)?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 28: Điều kiện để dự án đầu tư mở rộng được hưởng ưu đãi thuế (về vốn)?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• PHẢI ĐÁP ỨNG ĐỒNG THỜI HOẶC RIÊNG LẺ CÁC ĐIỀU KIỆN: (1) Vốn đầu tư tăng thêm tối thiểu từ 40 tỷ đồng (ngành ưu đãi) hoặc từ 20 tỷ đồng (địa bàn khó khăn). (2) Tỷ trọng nguyên giá TSCĐ tăng thêm đạt tối thiểu 20% so với trước khi mở rộng. (3) Công suất thiết kế tăng thêm đạt tối thiểu 20% so với trước khi mở rộng."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 6 Điều 20 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_29","label":"Câu 29","shortTitle":"Chi phí giá vốn được trừ đối với đất nhận quyền sử dụng của tổ chức, cá nhân khác xác định như nào?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 29: Chi phí giá vốn được trừ đối với đất nhận quyền sử dụng của tổ chức, cá nhân khác xác định như nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• Căn cứ vào hợp đồng và chứng từ trả tiền hợp pháp khi nhận quyền sử dụng đất. Trường hợp không có hợp đồng và chứng từ trả tiền hợp pháp thì giá vốn được tính theo giá đất tại bảng giá đất do UBND cấp tỉnh quy định (trước 01/01/2026) hoặc HĐND cấp tỉnh quyết định (kể từ 01/01/2026) tại thời điểm nhận chuyển nhượng BĐS."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a2 khoản 2 Điều 17 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_30","label":"Câu 30","shortTitle":"Mức trích lập Quỹ phát triển khoa học và công nghệ tối đa là bao nhiêu?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 30: Mức trích lập Quỹ phát triển khoa học và công nghệ tối đa là bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA 20% THU NHẬP TÍNH THUẾ. Doanh nghiệp được phép chủ động trích lập tối đa không quá 20% thu nhập tính thuế hàng năm để đưa vào Quỹ phát triển khoa học và công nghệ của đơn vị."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 1 Điều 22 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_31","label":"Câu 31","shortTitle":"Chi phí tham gia đấu thầu nhưng không trúng thầu có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 31: Chi phí tham gia đấu thầu nhưng không trúng thầu có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Khoản chi phí phát sinh hợp lý liên quan đến hồ sơ, thủ tục đấu thầu dù không đạt kết quả trúng thầu vẫn được tính vào chi phí hợp lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i1 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_32","label":"Câu 32","shortTitle":"Chi phí nghiên cứu sản phẩm mới nhưng không thành công xử lý thế nào?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 32: Chi phí nghiên cứu sản phẩm mới nhưng không thành công xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TÍNH VÀO CHI PHÍ ĐƯỢC TRỪ. Doanh nghiệp được tính vào chi phí được trừ khi có báo cáo nghiên cứu lưu trữ đầy đủ tại doanh nghiệp hoặc gửi cơ quan quản lý chuyên ngành (nếu luật chuyên ngành yêu cầu)."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i2 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_33","label":"Câu 33","shortTitle":"Tiền thuê đất tại khu công nghiệp khi chưa tham gia sản xuất kinh doanh có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 33: Tiền thuê đất tại khu công nghiệp khi chưa tham gia sản xuất kinh doanh có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Được tính vào chi phí được trừ nếu diện tích đất thuê đó chính là địa điểm quy hoạch đặt trụ sở hoặc cơ sở sản xuất kinh doanh hợp pháp của doanh nghiệp."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i3 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_34","label":"Câu 34","shortTitle":"Khấu hao tài sản cho thuê trong thời gian chưa có khách thuê được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 34: Khấu hao tài sản cho thuê trong thời gian chưa có khách thuê được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ KHẤU HAO. Được chấp nhận tính vào chi phí được trừ nếu tài sản đó thuộc quyền sở hữu hoặc sử dụng hợp pháp của doanh nghiệp và phục vụ mục đích kinh doanh lâu dài."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i4 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_35","label":"Câu 35","shortTitle":"Chi phí thành lập doanh nghiệp mới được tính vào đâu?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 35: Chi phí thành lập doanh nghiệp mới được tính vào đâu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC PHÂN BỔ VÀO CHI PHÍ ĐƯỢC TRỪ. Các chi phí khởi tạo ban đầu được tính thẳng vào chi phí được trừ hoặc phân bổ dần vào chi phí hoạt động khi xác định thu nhập chịu thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i5 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_36","label":"Câu 36","shortTitle":"Chi phí khôi phục hiện trạng sau khi tạm dừng sản xuất có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 36: Chi phí khôi phục hiện trạng sau khi tạm dừng sản xuất có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Các khoản chi liên quan đến cải tạo, khôi phục mặt bằng, hiện trạng nhà xưởng sau giai đoạn tạm dừng hoạt động được chấp nhận là chi phí hợp lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i5 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_37","label":"Câu 37","shortTitle":"Chi phí giới thiệu/marketing sản phẩm trước khi bán chính thức được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 37: Chi phí giới thiệu/marketing sản phẩm trước khi bán chính thức được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Khoản chi này được chấp nhận nếu doanh nghiệp có báo cáo về chủ trương đầu tư sản xuất thử nghiệm hoặc sản xuất thương mại sản phẩm đó."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i6 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_38","label":"Câu 38","shortTitle":"Chi phí hủy hàng tồn kho hết hạn sử dụng có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 38: Chi phí hủy hàng tồn kho hết hạn sử dụng có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Khoản chi phí được trừ bao gồm cả giá vốn của lượng hàng hóa bị hủy bỏ và các chi phí phát sinh phục vụ trực tiếp cho quá trình tiêu hủy."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i7 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_39","label":"Câu 39","shortTitle":"Chi phí hủy phế liệu, phế phẩm phát sinh trong sản xuất được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 39: Chi phí hủy phế liệu, phế phẩm phát sinh trong sản xuất được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Các khoản chi tiêu hủy phế phẩm phát sinh tự nhiên, không mong muốn trong quá trình sản xuất chế biến được tính vào chi phí được trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết i9 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_40","label":"Câu 40","shortTitle":"Khoản tài trợ cho các trường học thuộc hệ thống giáo dục quốc dân có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 40: Khoản tài trợ cho các trường học thuộc hệ thống giáo dục quốc dân có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Các khoản tài trợ cơ sở vật chất, trang thiết bị giảng dạy, học bổng cho học sinh sinh viên thuộc hệ thống quốc dân được tính vào chi phí hợp lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ1 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_41","label":"Câu 41","shortTitle":"Tài trợ cho cuộc thi môn học của học sinh, sinh viên có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 41: Tài trợ cho cuộc thi môn học của học sinh, sinh viên có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Chi phí tài trợ các giải đấu tri thức, cuộc thi học thuật cho đối tượng học sinh sinh viên được khấu trừ hoàn toàn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ1 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_42","label":"Câu 42","shortTitle":"Khoản tài trợ thiết bị y tế cho bệnh viện có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 42: Khoản tài trợ thiết bị y tế cho bệnh viện có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Doanh nghiệp được tính vào chi phí được trừ nếu chuẩn bị đầy đủ bộ hồ sơ chứng minh tài trợ, biên bản bàn giao thiết bị y tế theo quy định."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ2 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_43","label":"Câu 43","shortTitle":"Tài trợ trực tiếp cho Quỹ bảo tồn di sản văn hóa có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 43: Tài trợ trực tiếp cho Quỹ bảo tồn di sản văn hóa có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Các khoản đóng góp trực tiếp cho quỹ bảo tồn di sản được Nhà nước khuyến khích bằng cách cho trừ vào thu nhập chịu thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ3 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_44","label":"Câu 44","shortTitle":"Tài trợ làm nhà đại đoàn kết cho đối tượng chính sách có được trừ không?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 44: Tài trợ làm nhà đại đoàn kết cho đối tượng chính sách có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ. Chương trình an sinh xã hội xây dựng nhà tình nghĩa, nhà đại đoàn kết cho người nghèo, đối tượng chính sách được tính là chi phí hợp lệ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ5 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_45","label":"Câu 45","shortTitle":"Doanh nghiệp tài trợ xây dựng hạ tầng tại địa bàn đặc biệt khó khăn được hỗ trợ gì?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 45: Doanh nghiệp tài trợ xây dựng hạ tầng tại địa bàn đặc biệt khó khăn được hỗ trợ gì?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ VÀO CHI PHÍ. Toàn bộ giá trị tài trợ hạ tầng giao thông, điện đường trường trạm tại vùng kinh tế đặc biệt khó khăn được ghi nhận thẳng vào chi phí được trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ6 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_46","label":"Câu 46","shortTitle":"Tài trợ cho cá nhân bị thiệt hại do thiên tai thông qua tổ chức có thẩm quyền xử lý thế nào?","chuong":"Chủ đề 05 — Khuyến khích đầu tư, R&D & tài trợ","content":[{"k":"h3","t":"CÂU 46: Tài trợ cho cá nhân bị thiệt hại do thiên tai thông qua tổ chức có thẩm quyền xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ VÀO CHI PHÍ. Khoản tài trợ khắc phục hậu quả bão lũ, thiên tai chuyển qua các tổ chức hợp pháp (Mặt trận Tổ quốc, Hội Chữ thập đỏ…) được chấp nhận là chi phí hợp lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ4 khoản 2 Điều 9 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_6","label":"Chủ đề 06","shortTitle":"Tổng quan: Chi phí không được trừ & giới hạn khống chế nhân sự, tài chính","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"Tổng quan Chi phí không được trừ & giới hạn khống chế nhân sự, tài chính"},{"k":"p","t":"Bên cạnh chi phí được trừ, pháp luật khống chế một số khoản chi nhân sự và tài chính: phúc lợi, trang phục, lãi vay liên kết, chi không có hóa đơn. Vượt trần sẽ bị loại phần vượt khi tính thuế."},{"k":"p","t":"Doanh nghiệp nên lập bảng theo dõi các khoản bị khống chế theo tháng/quý, đối chiếu với mức trần (ví dụ phúc lợi không quá 01 tháng lương bình quân thực tế) trước khi khóa sổ."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 24 / 45"}]},{"id":"st_47","label":"Câu 47","shortTitle":"Tổng các khoản chi phúc lợi cho người lao động bị khống chế ở mức nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 47: Tổng các khoản chi phúc lợi cho người lao động bị khống chế ở mức nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA 01 THÁNG LƯƠNG BÌNH QUÂN. Tổng các khoản chi có tính chất phúc lợi trực tiếp cho người lao động không được vượt quá 01 tháng lương bình quân thực tế thực hiện trong năm tính thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_48","label":"Câu 48","shortTitle":"“01 tháng lương bình quân thực tế” được xác định cụ thể như thế nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 48: “01 tháng lương bình quân thực tế” được xác định cụ thể như thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• CHIA THEO QUỸ LƯƠNG THỰC TẾ. Lương bình quân tháng = Quỹ lương thực tế năm ÷ 12 * DN hoạt động dưới 12 tháng: chia cho số tháng thực tế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết d1 khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_49","label":"Câu 49","shortTitle":"Chi phí đám hiếu, hỷ cho gia đình nhân viên có được tính là chi phí phúc lợi không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 49: Chi phí đám hiếu, hỷ cho gia đình nhân viên có được tính là chi phí phúc lợi không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• CÓ, NHƯNG BỊ KHỐNG CHẾ. Khoản chi hiếu hỷ này được chấp nhận là chi phúc lợi trực tiếp, nhưng phải gộp chung vào tổng chi phúc lợi để khống chế dưới mức trần 01 tháng lương bình quân."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_50","label":"Câu 50","shortTitle":"Công ty mua bảo hiểm nhân thọ cho nhân viên mức 6 triệu/tháng thì được trừ bao nhiêu?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 50: Công ty mua bảo hiểm nhân thọ cho nhân viên mức 6 triệu/tháng thì được trừ bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ TỐI ĐA 05 TRIỆU. Phần chi vượt mức (01 triệu đồng/tháng/người) sẽ bị loại ra khỏi chi phí được trừ, chỉ chấp nhận tối đa 05 triệu đồng/tháng/người."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm đ khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_51","label":"Câu 51","shortTitle":"Điều kiện để tiền mua bảo hiểm tự nguyện cho nhân viên được tính vào chi phí được trừ?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 51: Điều kiện để tiền mua bảo hiểm tự nguyện cho nhân viên được tính vào chi phí được trừ?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• PHẢI ĐÁP ỨNG ĐỒNG THỜI 2 ĐIỀU KIỆN: (1) Nội dung, mức hưởng được ghi cụ thể trong hợp đồng lao động hoặc quy chế tài chính của doanh nghiệp. (2) Doanh nghiệp đã hoàn thành đóng đủ các loại bảo hiểm bắt buộc cho người lao động."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết đ1, đ2 khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_52","label":"Câu 52","shortTitle":"Chi trang phục bằng tiền cho nhân viên bị khống chế mức bao nhiêu?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 52: Chi trang phục bằng tiền cho nhân viên bị khống chế mức bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA 05 TRIỆU/NGƯỜI/NĂM. Phần chi bằng tiền vượt quá mức 05 triệu đồng/người/năm cho mục đích trang phục sẽ không được chấp nhận."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm đ khoản 8 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_53","label":"Câu 53","shortTitle":"Nếu chi trang phục hoàn toàn bằng hiện vật thì có bị khống chế mức 5 triệu không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 53: Nếu chi trang phục hoàn toàn bằng hiện vật thì có bị khống chế mức 5 triệu không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG BỊ KHỐNG CHẾ MỨC TRẦN. Giao dịch cấp phát trang phục bằng hiện vật không bị giới hạn 5 triệu đồng, nhưng doanh nghiệp phải xuất trình đầy đủ hóa đơn, chứng từ mua hàng hợp pháp."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm đ khoản 8 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_54","label":"Câu 54","shortTitle":"Tiền lương của giám đốc công ty TNHH một thành viên do một cá nhân làm chủ có được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 54: Tiền lương của giám đốc công ty TNHH một thành viên do một cá nhân làm chủ có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TUYỆT ĐỐI KHÔNG ĐƯỢC TRỪ. Pháp luật thuế xem khoản thu nhập này là lợi nhuận của chủ sở hữu đơn vị, không phải chi phí nhân công hợp lý của doanh nghiệp."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 8 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_55","label":"Câu 55","shortTitle":"Thù lao trả cho thành viên Hội đồng quản trị không trực tiếp điều hành xử lý thế nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 55: Thù lao trả cho thành viên Hội đồng quản trị không trực tiếp điều hành xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TÍNH VÀO CHI PHÍ. Chỉ có thù lao trả cho các thành viên trực tiếp tham gia xử lý, điều hành hoạt động sản xuất kinh doanh hàng ngày mới được tính trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 8 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_56","label":"Câu 56","shortTitle":"Tiền chậm nộp thuế có được tính vào chi phí được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 56: Tiền chậm nộp thuế có được tính vào chi phí được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ. Các khoản phạt vi phạm hành chính, phạt chậm nộp tiền thuế là chế tài xử phạt, không phục vụ mục đích sinh lời của doanh nghiệp nên không được khấu trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 2 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_57","label":"Câu 57","shortTitle":"Thuế GTGT nộp theo phương pháp khấu trừ có được tính vào chi phí được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 57: Thuế GTGT nộp theo phương pháp khấu trừ có được tính vào chi phí được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ, TRỪ 3 TRƯỜNG HỢP NGOẠI LỆ: (1) GTGT đầu ra của hàng biếu, tặng không thu tiền phục vụ SXKD. (2) GTGT phải nộp của hàng hóa, dịch vụ dùng để tài trợ theo điểm đ khoản 2 Điều 9. (3) GTGT đầu vào liên quan trực tiếp đến SXKD nhưng chưa được khấu trừ hết và không thuộc diện được hoàn thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 12 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_58","label":"Câu 58","shortTitle":"Chi phí lãi vay của doanh nghiệp có giao dịch liên kết bị khống chế theo quy định nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 58: Chi phí lãi vay của doanh nghiệp có giao dịch liên kết bị khống chế theo quy định nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHỐNG CHẾ THEO TỶ LỆ EBITDA. Thực hiện theo các quy định về quản lý thuế đối với doanh nghiệp phát sinh giao dịch liên kết nhằm tránh xói mòn cơ sở tính thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm c khoản 4 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_59","label":"Câu 59","shortTitle":"Chi trả lãi tiền vay tương ứng phần vốn điều lệ còn thiếu có được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 59: Chi trả lãi tiền vay tương ứng phần vốn điều lệ còn thiếu có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ. Doanh nghiệp phải ưu tiên góp đủ vốn điều lệ theo cam kết pháp lý trước khi tính toán chi phí lãi vay hợp lý."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 9 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_60","label":"Câu 60","shortTitle":"Doanh nghiệp phát sinh nhiều khoản vay thì khoản chi trả lãi tiền vay không được trừ thế nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 60: Doanh nghiệp phát sinh nhiều khoản vay thì khoản chi trả lãi tiền vay không được trừ thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ÁP DỤNG CÔNG THỨC PHÂN BỔ LÃI VAY. Lãi vay không được trừ = (Vốn điều lệ thiếu ÷ Tổng tiền vay) × Tổng lãi vay"},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Tiết b2 khoản 9 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_61","label":"Câu 61","shortTitle":"Chi trả lãi tiền vay của đối tượng không phải tổ chức tín dụng bị khống chế thế nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 61: Chi trả lãi tiền vay của đối tượng không phải tổ chức tín dụng bị khống chế thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG VƯỢT QUÁ TRẦN DÂN SỰ. Mức lãi suất chi trả không được phép vượt quá giới hạn tỷ lệ trần quy định tại Bộ luật Dân sự hiện hành."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 10 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_62","label":"Câu 62","shortTitle":"Thuế TNDN nộp thay doanh nghiệp nước ngoài có được tính là chi phí được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 62: Thuế TNDN nộp thay doanh nghiệp nước ngoài có được tính là chi phí được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ NẾU THỎA THUẬN NET. Được chấp nhận là chi phí hợp lý nếu hợp đồng nhà thầu quy định rõ doanh thu nhà thầu nước ngoài nhận được là doanh thu thuần (không bao gồm thuế TNDN)."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 12 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_63","label":"Câu 63","shortTitle":"Thuế TNCN nộp thay cho người lao động có được tính vào chi phí được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 63: Thuế TNCN nộp thay cho người lao động có được tính vào chi phí được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ NẾU THỎA THUẬN NET. Được chấp nhận tính trừ nếu hợp đồng lao động quy định cụ thể mức tiền lương trả cho nhân viên là lương sau thuế (Net), không bao gồm thuế TNCN."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 12 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_64","label":"Câu 64","shortTitle":"Chi phí điện nước tại địa điểm thuê nhưng hợp đồng mang tên chủ nhà được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 64: Chi phí điện nước tại địa điểm thuê nhưng hợp đồng mang tên chủ nhà được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ NẾU CÓ ĐỦ CHỨNG TỪ. Doanh nghiệp được tính trừ nếu có hóa đơn thanh toán thực tế đi kèm hợp đồng thuê địa điểm thể hiện rõ doanh nghiệp trực tiếp thanh toán hoặc hoàn trả tiền điện nước phù hợp mức tiêu thụ thực tế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 14 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_65","label":"Câu 65","shortTitle":"Chi phí sửa chữa tài sản cố định đi thuê được phân bổ tối đa bao nhiêu năm?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 65: Chi phí sửa chữa tài sản cố định đi thuê được phân bổ tối đa bao nhiêu năm?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA KHÔNG QUÁ 03 NĂM. Áp dụng trong trường hợp hợp đồng thuê tài sản quy định rõ bên đi thuê chịu hoàn toàn trách nhiệm và chi phí sửa chữa tài sản đó."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 15 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_66","label":"Câu 66","shortTitle":"Doanh nghiệp góp vốn bằng giá trị thương hiệu thì có được trừ chi phí không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 66: Doanh nghiệp góp vốn bằng giá trị thương hiệu thì có được trừ chi phí không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TÍNH CHI PHÍ KHẤU HAO. Giá trị quyền sử dụng thương hiệu mang đi góp vốn pháp lý không được phép tính khấu hao vào chi phí được trừ của doanh nghiệp nhận vốn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm c khoản 15 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_67","label":"Câu 67","shortTitle":"Lỗ chênh lệch tỷ giá do đánh giá lại tiền mặt tại quỹ cuối năm xử lý thế nào?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 67: Lỗ chênh lệch tỷ giá do đánh giá lại tiền mặt tại quỹ cuối năm xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TÍNH VÀO CHI PHÍ ĐƯỢC TRỪ. Các khoản đánh giá lại số dư tiền mặt, tiền gửi cuối năm không trực tiếp tạo ra dòng lỗ thực tế nên không được khấu trừ thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 16 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_68","label":"Câu 68","shortTitle":"Khoản chi liên quan trực tiếp đến việc phát hành cổ phiếu có được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 68: Khoản chi liên quan trực tiếp đến việc phát hành cổ phiếu có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ. Ngoại trừ loại cổ phiếu được phân loại là nợ phải trả, các khoản chi phí phục vụ hoạt động phát hành cổ phiếu tăng vốn chủ sở hữu hoàn toàn không được khấu trừ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 19 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_69","label":"Câu 69","shortTitle":"Số tiền cấp quyền khai thác khoáng sản vượt mức phải nộp hàng năm theo quy định có được trừ không?","chuong":"Chủ đề 06 — Chi phí không được trừ & giới hạn khống chế","content":[{"k":"h3","t":"CÂU 69: Số tiền cấp quyền khai thác khoáng sản vượt mức phải nộp hàng năm theo quy định có được trừ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG ĐƯỢC TRỪ. Phần giá trị cấp quyền khai thác khoáng sản nộp vượt mức tính toán phân bổ hàng năm sẽ bị cơ quan thuế loại bỏ hoàn toàn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 20 Điều 10 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_7","label":"Chủ đề 07","shortTitle":"Tổng quan: Thu nhập chịu thuế khác & nguyên tắc chuyển lỗ tối đa 5 năm","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"Tổng quan Thu nhập chịu thuế khác & nguyên tắc chuyển lỗ tối đa 5 năm"},{"k":"p","t":"Thu nhập chịu thuế không chỉ gồm doanh thu bán hàng. Nợ khó đòi đã xóa nay đòi được, chênh lệch đánh giá lại, thu nhập từ chuyển nhượng đều phải tính. Lỗ được chuyển tối đa 05 năm liên tục."},{"k":"p","t":"Khi sáp nhập, chia tách, nguyên tắc kế thừa lỗ và bù trừ lỗ giữa các hoạt động phải tuân thủ đúng điều kiện để không bị loại số lỗ chuyển tiếp."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 30 / 45"}]},{"id":"st_70","label":"Câu 70","shortTitle":"Khoản nợ khó đòi đã xóa nay đòi được thì kê khai xác định thu nhập chịu thuế như thế nào?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 70: Khoản nợ khó đòi đã xóa nay đòi được thì kê khai xác định thu nhập chịu thuế như thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TÍNH VÀO THU NHẬP KHÁC. Khoản tiền thu hồi được từ khoản nợ phải thu khó đòi đã hoàn tất thủ tục xóa sổ trước đó bắt buộc phải kê khai vào thu nhập khác chịu thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm k khoản 3 Điều 3 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_71","label":"Câu 71","shortTitle":"Lỗ từ chuyển nhượng bất động sản có được bù trừ với lãi từ sản xuất không?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 71: Lỗ từ chuyển nhượng bất động sản có được bù trừ với lãi từ sản xuất không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC BÙ TRỪ LINH HOẠT. Doanh nghiệp được phép bù trừ số lỗ từ hoạt động chuyển nhượng BĐS vào thu nhập của các hoạt động SXKD thông thường khác (nhưng không được bù trừ vào các thu nhập đang hưởng ưu đãi thuế)."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 2, khoản 3 Điều 6 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_72","label":"Câu 72","shortTitle":"Thời gian chuyển lỗ tối đa của doanh nghiệp là bao nhiêu năm?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 72: Thời gian chuyển lỗ tối đa của doanh nghiệp là bao nhiêu năm?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TỐI ĐA 05 NĂM LIÊN TỤC. Thời hạn chuyển toàn bộ số lỗ phát sinh sau quyết toán được thực hiện liên tục không quá 05 năm kể từ năm tiếp theo năm phát sinh lỗ."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 2 Điều 7 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_73","label":"Câu 73","shortTitle":"Khi sáp nhập, doanh nghiệp mới có được kế thừa số lỗ của doanh nghiệp cũ không?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 73: Khi sáp nhập, doanh nghiệp mới có được kế thừa số lỗ của doanh nghiệp cũ không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC THỪA KẾ LỖ. Doanh nghiệp mới được tiếp tục theo dõi và chuyển tiếp số lỗ của doanh nghiệp cũ sáp nhập vào nếu số lỗ đó vẫn nằm trong thời hạn chuyển lỗ 05 năm."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 4 Điều 7 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_74","label":"Câu 74","shortTitle":"Thu nhập từ chuyển nhượng chứng khoán của doanh nghiệp được xác định là khoản thu nhập nào khi tính thuế TNDN?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 74: Thu nhập từ chuyển nhượng chứng khoán của doanh nghiệp được xác định là khoản thu nhập nào khi tính thuế TNDN?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THU NHẬP KHÁC. Toàn bộ khoản thu nhập từ chuyển nhượng chứng khoán được phân loại vào danh mục thu nhập khác chịu thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 1 Điều 14 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_75","label":"Câu 75","shortTitle":"Lãi tiền gửi ngân hàng của doanh nghiệp (không phải tổ chức tín dụng) tính vào đâu?","chuong":"Chủ đề 07 — Thu nhập khác & nguyên tắc chuyển lỗ","content":[{"k":"h3","t":"CÂU 75: Lãi tiền gửi ngân hàng của doanh nghiệp (không phải tổ chức tín dụng) tính vào đâu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THU NHẬP KHÁC. Khoản tiền lãi phát sinh từ các tài khoản tiền gửi thanh toán, tiền gửi kỳ hạn của doanh nghiệp được tính vào thu nhập khác."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm g1 khoản 3 Điều 3 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_8","label":"Chủ đề 08","shortTitle":"Tổng quan: Đặc quyền miễn thuế TNDN lĩnh vực xanh & an sinh xã hội","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"Tổng quan Đặc quyền miễn thuế TNDN lĩnh vực xanh & an sinh xã hội"},{"k":"p","t":"Thu nhập từ lĩnh vực xanh và an sinh xã hội được miễn thuế TNDN trong nhiều trường hợp: tín chỉ carbon, nông nghiệp, thủy lợi, trái phiếu xanh, hoạt động vì người khuyết tật."},{"k":"p","t":"Doanh nghiệp cần tách bạch doanh thu được miễn và doanh thu chịu thuế, lưu hồ sơ chứng minh tính chất hoạt động để bảo toàn quyền lợi khi quyết toán."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 33 / 45"}]},{"id":"st_76","label":"Câu 76","shortTitle":"Thu nhập từ chuyển nhượng tín chỉ các-bon lần đầu có được ưu đãi gì không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 76: Thu nhập từ chuyển nhượng tín chỉ các-bon lần đầu có được ưu đãi gì không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN HOÀN TOÀN. Nhằm thúc đẩy thị trường tín chỉ carbon nội địa, khoản thu nhập từ hoạt động chuyển nhượng lần đầu được miễn thuế hoàn toàn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 10 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_77","label":"Câu 77","shortTitle":"Thu nhập từ thực hiện nhiệm vụ Nhà nước giao như của một số Quỹ có phải nộp thuế TNDN không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 77: Thu nhập từ thực hiện nhiệm vụ Nhà nước giao như của một số Quỹ có phải nộp thuế TNDN không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC MIỄN THUẾ. Miễn thuế TNDN đối với các khoản thu nhập phát sinh từ hoạt động thực hiện nhiệm vụ chính trị, nhiệm vụ nhà nước giao của một số Quỹ tài chính đặc thù được quy định trong Nghị định."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 11 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_78","label":"Câu 78","shortTitle":"Nếu sử dụng khoản tài trợ, hỗ trợ nhận được không đúng mục đích thì bị xử lý ra sao?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 78: Nếu sử dụng khoản tài trợ, hỗ trợ nhận được không đúng mục đích thì bị xử lý ra sao?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TRUY THU THUẾ VÀ XỬ PHẠT. Doanh nghiệp sử dụng sai mục đích khoản nhận tài trợ sẽ bị truy thu hoàn toàn số thuế đã được miễn và áp dụng các chế tài xử phạt theo quy định."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm e khoản 8 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_79","label":"Câu 79","shortTitle":"Thu nhập từ chế biến nông sản tại địa bàn đặc biệt khó khăn có được miễn thuế không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 79: Thu nhập từ chế biến nông sản tại địa bàn đặc biệt khó khăn có được miễn thuế không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ HOÀN TOÀN. Các dự án đầu tư hoạt động trong lĩnh vực chế biến nông, lâm, thủy sản đặt tại vùng kinh tế đặc biệt khó khăn được miễn thuế TNDN."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 1 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_80","label":"Câu 80","shortTitle":"Hợp tác xã sản xuất muối có được miễn thuế TNDN không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 80: Hợp tác xã sản xuất muối có được miễn thuế TNDN không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ HOÀN TOÀN. Hoạt động sản xuất muối của các hợp tác xã được bảo hộ bằng chính sách miễn hoàn toàn thuế TNDN."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 1 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_81","label":"Câu 81","shortTitle":"Thu nhập từ dịch vụ tưới, tiêu nước trực tiếp phục vụ nông nghiệp có nộp thuế không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 81: Thu nhập từ dịch vụ tưới, tiêu nước trực tiếp phục vụ nông nghiệp có nộp thuế không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN. Các hoạt động dịch vụ tưới tiêu, cày bừa trực tiếp phục vụ nông nghiệp được miễn hoàn toàn nghĩa vụ thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 3 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_82","label":"Câu 82","shortTitle":"Doanh nghiệp có 40% lao động bình quân trong năm là người khuyết tật có ưu đãi gì?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 82: Doanh nghiệp có 40% lao động bình quân trong năm là người khuyết tật có ưu đãi gì?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN. Được áp dụng miễn thuế nếu quy mô nhân sự đạt từ 20 lao động trở lên (ngoại trừ các đơn vị hoạt động trong lĩnh vực tài chính và bất động sản)."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 5 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_83","label":"Câu 83","shortTitle":"Thu nhập từ đào tạo nghề dành riêng cho trẻ em có hoàn cảnh đặc biệt xử lý thế nào?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 83: Thu nhập từ đào tạo nghề dành riêng cho trẻ em có hoàn cảnh đặc biệt xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN. Khoản thu nhập từ hoạt động dạy nghề chuyên biệt cho trẻ em mồ côi, cơ nhỡ, khuyết tật được miễn thuế hoàn toàn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 6 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_84","label":"Câu 84","shortTitle":"Thu nhập nhận được từ liên doanh trong nước đã nộp thuế TNDN có phải nộp lần nữa không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 84: Thu nhập nhận được từ liên doanh trong nước đã nộp thuế TNDN có phải nộp lần nữa không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• KHÔNG NỘP LẠI. Khoản lợi nhuận chia từ hoạt động liên doanh, liên kết trong nước đã thực hiện nghĩa vụ thuế TNDN tại nguồn được miễn thuế khi chuyển về doanh nghiệp nhằm tránh đánh thuế trùng."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 7 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_85","label":"Câu 85","shortTitle":"Thu nhập từ tiền lãi trái phiếu xanh có được ưu đãi không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 85: Thu nhập từ tiền lãi trái phiếu xanh có được ưu đãi không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN. Các khoản thu nhập từ tiền lãi khi đầu tư vào công cụ nợ trái phiếu xanh được miễn hoàn toàn thuế để kích thích dòng vốn xanh."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 10 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_86","label":"Câu 86","shortTitle":"Thu nhập của đơn vị sự nghiệp công lập từ cung cấp dịch vụ sự nghiệp công tại địa bàn đặc biệt khó khăn xử lý thế nào?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 86: Thu nhập của đơn vị sự nghiệp công lập từ cung cấp dịch vụ sự nghiệp công tại địa bàn đặc biệt khó khăn xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ TNDN. Thu nhập từ việc cung ứng dịch vụ công tại vùng kinh tế đặc biệt khó khăn của đơn vị sự nghiệp công lập được miễn thuế hoàn toàn."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 14 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_87","label":"Câu 87","shortTitle":"Thu nhập từ bán sản phẩm làm từ công nghệ mới lần đầu áp dụng tại Việt Nam được miễn thuế bao lâu?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 87: Thu nhập từ bán sản phẩm làm từ công nghệ mới lần đầu áp dụng tại Việt Nam được miễn thuế bao lâu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ 03 NĂM. Doanh nghiệp được miễn thuế TNDN liên tục trong 03 năm tính từ năm đầu tiên phát sinh thu nhập chịu thuế từ việc bán sản phẩm này."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 4 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_88","label":"Câu 88","shortTitle":"Sản phẩm sản xuất thử nghiệm có được miễn thuế không?","chuong":"Chủ đề 08 — Miễn thuế lĩnh vực xanh & an sinh xã hội","content":[{"k":"h3","t":"CÂU 88: Sản phẩm sản xuất thử nghiệm có được miễn thuế không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN THUẾ 03 NĂM. Áp dụng đối với sản phẩm sản xuất thử nghiệm trong giai đoạn nghiên cứu có văn bản xác nhận chính thức từ cơ quan nhà nước có thẩm quyền."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm c khoản 4 Điều 4 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"cd_9","label":"Chủ đề 09","shortTitle":"Tổng quan: Thuế suất ưu đãi 10%, 17%, thời gian miễn giảm & địa bàn ưu đãi","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"Tổng quan Thuế suất ưu đãi 10%, 17%, thời gian miễn giảm & địa bàn ưu đãi"},{"k":"p","t":"Hệ thống ưu đãi thuế suất 10%, 17% và thời gian miễn, giảm thuế gắn với địa bàn, ngành nghề, dự án công nghệ cao, khu kinh tế. Thời gian tính ưu đãi được xác định từ năm đầu tiên có thu nhập chịu thuế hoặc năm đầu có doanh thu tùy trường hợp."},{"k":"p","t":"Khi cùng lúc hưởng nhiều mức ưu đãi, doanh nghiệp chỉ được chọn một mức có lợi nhất theo nguyên tắc không cộng dồn trái quy định. Thuế đã nộp ở nước ngoài được khấu trừ có giới hạn."},{"k":"h3","t":"Các điểm cốt lõi doanh nghiệp cần đặc biệt lưu ý:"},{"k":"p","t":"✔ Nắm vững căn cứ pháp lý để bảo vệ chi phí được trừ khi thanh tra, kiểm tra thuế."},{"k":"p","t":"✔ Thiết lập hồ sơ chứng từ chuẩn chỉ ngay từ thời điểm giao dịch phát sinh trong kỳ."},{"k":"p","t":"✔ Chủ động áp dụng chính sách ưu đãi thuế, tối ưu hóa dòng tiền hoạt động của doanh nghiệp. NGHIỆP Trang 37 / 45"}]},{"id":"st_89","label":"Câu 89","shortTitle":"Thu nhập từ chuyển nhượng vốn của công ty có được áp dụng thuế suất ưu đãi 15% không?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 89: Thu nhập từ chuyển nhượng vốn của công ty có được áp dụng thuế suất ưu đãi 15% không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TUYỆT ĐỐI KHÔNG. Thu nhập phát sinh từ chuyển nhượng vốn, chuyển nhượng dự án đầu tư bắt buộc phải nộp theo thuế suất phổ thông là 20%, không được áp dụng các thuế suất ưu đãi."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 9 Điều 23 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_90","label":"Câu 90","shortTitle":"Doanh nghiệp đầu tư tại nước chưa ký Hiệp định tránh đánh thuế hai lần có mức thuế suất TNDN thấp hơn tại Việt Nam, phần thuế đã nộp ở nước ngoài xử lý thế nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 90: Doanh nghiệp đầu tư tại nước chưa ký Hiệp định tránh đánh thuế hai lần có mức thuế suất TNDN thấp hơn tại Việt Nam, phần thuế đã nộp ở nước ngoài xử lý thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC TRỪ CÓ GIỚI HẠN. Số thuế đã nộp thực tế tại nước ngoài được trừ vào số thuế phải nộp tại Việt Nam, nhưng mức khấu trừ tối đa không được vượt quá số thuế thu nhập tính theo Luật Thuế TNDN của Việt Nam."}]},{"id":"st_91","label":"Câu 91","shortTitle":"Doanh nghiệp công nghệ cao theo quy định của Luật Công nghệ cao, Luật Khoa học đổi mới sáng tạo, thực hiện dự án đầu tư mới được hưởng thuế suất ưu đãi bao nhiêu?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 91: Doanh nghiệp công nghệ cao theo quy định của Luật Công nghệ cao, Luật Khoa học đổi mới sáng tạo, thực hiện dự án đầu tư mới được hưởng thuế suất ưu đãi bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 10% TRONG 15 NĂM. Dự án đầu tư mới đáp ứng đầy đủ tiêu chuẩn công nghệ cao được áp dụng mức thuế suất ưu đãi 10% trong vòng 15 năm."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 1 Điều 19 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_92","label":"Câu 92","shortTitle":"Dự án đầu tư mới tại địa bàn có điều kiện kinh tế - xã hội khó khăn hưởng thuế suất bao nhiêu?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 92: Dự án đầu tư mới tại địa bàn có điều kiện kinh tế - xã hội khó khăn hưởng thuế suất bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 17% TRONG 10 NĂM. Áp dụng đối với dự án mới thực hiện tại địa bàn khó khăn thuộc danh mục quy định (trừ một số trường hợp ngoại lệ)."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 4 Điều 19 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_93","label":"Câu 93","shortTitle":"Dự án đầu tư mới tại khu kinh tế hưởng thuế suất bao nhiêu?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 93: Dự án đầu tư mới tại khu kinh tế hưởng thuế suất bao nhiêu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 10% TRONG 15 NĂM. Áp dụng đối với dự án đầu tư mới tại khu kinh tế nằm trên địa bàn ưu đãi thuế hoặc dự án có trên 50% diện tích nằm trên địa bàn ưu đãi thuế."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm d khoản 1 Điều 19 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_94","label":"Câu 94","shortTitle":"Doanh nghiệp khoa học và công nghệ được miễn, giảm thuế bao lâu?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 94: Doanh nghiệp khoa học và công nghệ được miễn, giảm thuế bao lâu?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• MIỄN 4 NĂM, GIẢM 50% TRONG 9 NĂM TIẾP THEO. Lộ trình miễn giảm dài hạn nhằm tạo điều kiện cho các doanh nghiệp KH&CN thương mại hóa thành công kết quả nghiên cứu."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 1 Điều 20 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_95","label":"Câu 95","shortTitle":"Thời gian miễn thuế, giảm thuế tính từ khi nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 95: Thời gian miễn thuế, giảm thuế tính từ khi nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TÍNH LIÊN TỤC TỪ KHI CÓ THU NHẬP CHỊU THUẾ. Tính liên tục từ năm đầu tiên phát sinh thu nhập chịu thuế; nếu trong 03 năm đầu kể từ năm đầu tiên có doanh thu mà dự án chưa có thu nhập chịu thuế thì thời gian miễn giảm bắt đầu tính từ năm thứ 04."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 4 Điều 20 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_96","label":"Câu 96","shortTitle":"Nếu dự án không có thu nhập chịu thuế trong 3 năm đầu thì tính miễn giảm thế nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 96: Nếu dự án không có thu nhập chịu thuế trong 3 năm đầu thì tính miễn giảm thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• TÍNH TỪ NĂM THỨ TƯ CÓ DOANH THU. Việc tính ưu đãi từ năm thứ 4 kể từ khi phát sinh doanh thu giúp bảo vệ quyền lợi ưu đãi tối đa cho doanh nghiệp trong giai đoạn đầu xây dựng thị trường."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 4 Điều 20 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_97","label":"Câu 97","shortTitle":"Doanh nghiệp được hưởng nhiều mức ưu đãi thuế khác nhau đối với cùng một khoản thu nhập thì áp dụng thế nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 97: Doanh nghiệp được hưởng nhiều mức ưu đãi thuế khác nhau đối với cùng một khoản thu nhập thì áp dụng thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC CHỌN MỨC CÓ LỢI NHẤT. Doanh nghiệp được quyền tự quyết định áp dụng mức ưu đãi thuế tối ưu và có lợi nhất cho hoạt động kinh doanh của mình."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Khoản 2 Điều 23 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_98","label":"Câu 98","shortTitle":"Doanh nghiệp sản xuất tại địa bàn ưu đãi nhưng bán hàng ra ngoài địa bàn có được hưởng ưu đãi không?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 98: Doanh nghiệp sản xuất tại địa bàn ưu đãi nhưng bán hàng ra ngoài địa bàn có được hưởng ưu đãi không?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• ĐƯỢC HƯỞNG ƯU ĐÃI. Toàn bộ thu nhập phát sinh từ hoạt động sản xuất thực tế tại nhà xưởng đặt trong địa bàn ưu đãi vẫn được hưởng ưu đãi đầy đủ khi phân phối hàng hóa ra toàn quốc."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm a khoản 3 Điều 23 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_99","label":"Câu 99","shortTitle":"Dự án dịch vụ tại địa bàn ưu đãi thuế tính thuế thế nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 99: Dự án dịch vụ tại địa bàn ưu đãi thuế tính thuế thế nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• CHỈ ƯU ĐÃI THU NHẬP TẠI ĐỊA BÀN. Khác với sản xuất, dự án dịch vụ chỉ được áp dụng ưu đãi thuế đối với phần thu nhập thực tế phát sinh từ các dịch vụ thực hiện tại chính địa bàn ưu đãi đó."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 3 Điều 23 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"st_100","label":"Câu 100","shortTitle":"Dự án đầu tư xây dựng nhà ở xã hội để bán nộp thuế mức nào?","chuong":"Chủ đề 09 — Thuế suất ưu đãi & địa bàn","content":[{"k":"h3","t":"CÂU 100: Dự án đầu tư xây dựng nhà ở xã hội để bán nộp thuế mức nào?"},{"k":"p","t":"<b>TRẢ LỜI:</b>"},{"k":"p","t":"• THUẾ SUẤT 10% SUỐT QUÁ TRÌNH. Áp dụng mức thuế suất ưu đãi cố định 10% trong suốt thời gian hoạt động của dự án xây dựng nhà ở xã hội để bán hoặc cho thuê."},{"k":"p","t":"<b>CĂN CỨ PHÁP LÝ: ⚖ Điểm b khoản 2 Điều 19 Nghị định số 320/2025/NĐ-CP.</b>"}]},{"id":"loi_ket","label":"Lời kết","shortTitle":"Lời kết & Khuyến nghị quản trị thuế 2026","chuong":"Phần kết — Khuyến nghị & Phụ lục","content":[{"k":"h3","t":"LỜI KẾT TỪ BAN BIÊN SOẠN — KHUYẾN NGHỊ QUẢN TRỊ THUẾ 2026"},{"k":"p","t":"Sự tương tác chính sách giữa Nghị định số 320/2025/NĐ-CP và Nghị định số 141/2026/NĐ-CP tạo khung quản trị thuế mới cho doanh nghiệp năm 2026. Việc nắm vững ngưỡng miễn thuế, biểu thuế suất theo quy mô, điều kiện chi phí được trừ và nguyên tắc ưu đãi địa bàn giúp doanh nghiệp chủ động dòng tiền, giảm rủi ro bị loại chi phí và bảo toàn quyền lợi hợp pháp."},{"k":"p","t":"⚖ <b>THƯỢNG TÔN PHÁP LUẬT:</b> Tuân thủ nghiêm ngặt các quy định về điều kiện chi phí được trừ, hóa đơn điện tử hợp pháp và thanh toán qua ngân hàng để triệt tiêu mọi rủi ro xử phạt."},{"k":"p","t":"⚡ <b>SỐ HÓA BỘ LỌC HÓA ĐƠN:</b> Hạ ngưỡng thanh toán xuống 5 triệu đồng đòi hỏi chuyển đổi số ngay trong quy trình kiểm soát mua hàng và tích hợp phần mềm kế toán tự động cảnh báo."},{"k":"p","t":"📈 <b>TỐI ƯU ƯU ĐÃI & DÒNG TIỀN:</b> Tận dụng triệt để chính sách miễn thuế DN siêu nhỏ, khấu trừ bổ sung R&D (200%), trích lập Quỹ KH&CN và ưu đãi thuế suất địa bàn để tái đầu tư mở rộng."},{"k":"h3","t":"CHECKLIST 03 NHÓM GIẢI PHÁP QUẢN TRỊ CẤP BÁCH NĂM 2026:"},{"k":"p","t":"1. <b>Chủ động thiết lập bộ lọc giao dịch tự động trong bộ phận kế toán:</b> Với việc hạ ngưỡng thanh toán không dùng tiền mặt xuống 5 triệu đồng, doanh nghiệp cần tích hợp phần mềm hóa đơn điện tử có khả năng cảnh báo giao dịch cộng gộp trong ngày vượt mức quy định. Bộ phận mua hàng phải thanh toán qua ngân hàng đối với mọi hóa đơn từ 5 triệu đồng trở lên."},{"k":"p","t":"2. <b>Hoàn thiện cấu trúc hồ sơ chứng minh chi phí đặc thù:</b> Doanh nghiệp áp dụng khấu trừ bổ sung chi phí R&D (tối đa 200%) hoặc trích lập Quỹ KH&CN phải có báo cáo nghiên cứu khả thi, hóa đơn thiết bị thí nghiệm và danh sách nhân sự dự án lưu trữ nội bộ đầy đủ."},{"k":"p","t":"3. <b>Định vị chính xác địa bàn ưu đãi và phân bổ thu nhập dịch vụ:</b> Tách bạch doanh thu phát sinh tại địa bàn thực hiện dự án và doanh thu ngoài địa bàn để bảo vệ quyền lợi ưu đãi thuế suất khi quyết toán."}]},{"id":"pl_1","label":"Phụ lục I","shortTitle":"Phụ lục I: Hệ thống văn bản Luật & Nghị định trích dẫn","chuong":"Phần kết — Khuyến nghị & Phụ lục","content":[{"k":"h3","t":"PHỤ LỤC I: HỆ THỐNG VĂN BẢN CẤP LUẬT & NGHỊ ĐỊNH ĐƯỢC TRÍCH DẪN"},{"k":"p","t":"Danh mục đầy đủ 07 Luật và 08 Nghị định được trích dẫn trong 100 câu hỏi nghiệp vụ thuế TNDN:"},{"k":"p","t":"<b>1. CÁC VĂN BẢN CẤP LUẬT:</b>"},{"k":"p","t":"• Luật Thuế Thu nhập doanh nghiệp số 14/2008/QH12 (và Luật Thuế TNDN số 67/2025/QH15)."},{"k":"p","t":"• Luật Quản lý thuế số 108/2025/QH15 & Luật Quản lý thuế số 38/2019/QH14 (sửa đổi bởi Luật 56/2024/QH15)."},{"k":"p","t":"• Luật Doanh nghiệp số 59/2020/QH14 & Luật Hỗ trợ Doanh nghiệp nhỏ và vừa số 04/2017/QH14."},{"k":"p","t":"• Luật Công nghệ cao số 21/2008/QH12 & Luật Khoa học & Công nghệ số 29/2013/QH13."},{"k":"p","t":"• Luật Đầu tư số 61/2020/QH14."},{"k":"p","t":"<b>2. CÁC NGHỊ ĐỊNH HƯỚNG DẪN CỐT LÕI:</b>"},{"k":"p","t":"• Nghị định số 320/2025/NĐ-CP — Quy định chi tiết thi hành Luật Thuế Thu nhập doanh nghiệp."},{"k":"p","t":"• Nghị định số 141/2026/NĐ-CP — Sửa đổi, bổ sung một số điều của Nghị định số 320/2025/NĐ-CP."},{"k":"p","t":"• Nghị định số 126/2020/NĐ-CP & Nghị định số 91/2022/NĐ-CP — Hướng dẫn Luật Quản lý thuế."},{"k":"p","t":"• Nghị định số 132/2020/NĐ-CP — Quản lý thuế đối với doanh nghiệp có giao dịch liên kết."},{"k":"p","t":"• Nghị định số 80/2021/NĐ-CP — Hướng dẫn Luật Hỗ trợ Doanh nghiệp nhỏ và vừa."}]},{"id":"pl_2","label":"Phụ lục II","shortTitle":"Phụ lục II: Ma trận đối chiếu điều khoản Nghị định 320 & 141","chuong":"Phần kết — Khuyến nghị & Phụ lục","content":[{"k":"h3","t":"PHỤ LỤC II: MA TRẬN ĐỐI CHIẾU ĐIỀU KHOẢN NGHỊ ĐỊNH 320/2025 & NGHỊ ĐỊNH 141/2026"},{"k":"p","t":"Bảng tra cứu đối chiếu trực tiếp 16 Điều khoản cốt lõi của Nghị định 320/2025/NĐ-CP & Nghị định 141/2026/NĐ-CP với 100 câu hỏi tình huống:"},{"k":"p","t":"• <b>Điều 2 (Người nộp thuế & tiêu chuẩn DN siêu nhỏ):</b> Câu 1, Câu 2, Câu 3, Câu 4, Câu 5."},{"k":"p","t":"• <b>Điều 3 (Thu nhập chịu thuế khác):</b> Câu 70, Câu 75."},{"k":"p","t":"• <b>Điều 4 (Thu nhập miễn thuế TNDN & bổ sung bởi NĐ 141):</b> Câu 1 đến Câu 8, Câu 76 đến Câu 88."},{"k":"p","t":"• <b>Điều 6 (Phương pháp xác định thu nhập tính thuế):</b> Câu 71."},{"k":"p","t":"• <b>Điều 7 (Nguyên tắc xác định lỗ và chuyển lỗ liên tục 5 năm):</b> Câu 72, Câu 73."},{"k":"p","t":"• <b>Điều 8 (Thời điểm & phương pháp xác định doanh thu tính thuế):</b> Câu 13 đến Câu 23."},{"k":"p","t":"• <b>Điều 9 (Các khoản chi được trừ & ưu đãi R&D 200%):</b> Câu 24 đến Câu 46."},{"k":"p","t":"• <b>Điều 10 (Các khoản chi không được trừ & giới hạn khống chế):</b> Câu 47 đến Câu 69."},{"k":"p","t":"• <b>Điều 11 (Biểu thuế suất 15%, 17% theo quy mô doanh thu):</b> Câu 9 đến Câu 12."},{"k":"p","t":"• <b>Điều 14 đến 20 (Ưu đãi thuế suất 10%, 17%, địa bàn & ngành nghề):</b> Câu 89 đến Câu 100."}]},{"id":"luoc_do","label":"Lược đồ rủi ro","shortTitle":"Lược đồ kiểm soát rủi ro & Cổng tra cứu quốc gia","chuong":"Phần kết — Khuyến nghị & Phụ lục","content":[{"k":"h3","t":"LƯỢC ĐỒ KIỂM SOÁT RỦI RO & CỔNG TRA CỨU ĐIỆN TỬ QUỐC GIA"},{"k":"p","t":"<b>🔄 QUY TRÌNH 4 BƯỚC RÀ SOÁT NGHĨA VỤ THUẾ TNDN TRƯỚC KHI KHÓA SỔ:</b>"},{"k":"p","t":"<b>01. Bước 1 — Rà soát thanh toán không dùng tiền mặt:</b> Kiểm tra toàn bộ hóa đơn từ 5 triệu đồng trở lên trong kỳ. Đảm bảo 100% có ủy nhiệm chi hoặc chứng từ chuyển khoản hợp lệ từ tài khoản công ty."},{"k":"p","t":"<b>02. Bước 2 — Kiểm soát các khoản chi khống chế:</b> Đối chiếu chi phí phúc lợi không vượt quá 01 tháng lương bình quân thực tế; trang phục không quá 5 triệu đồng/người/năm; trần lãi vay giao dịch liên kết dưới 30% EBITDA."},{"k":"p","t":"<b>03. Bước 3 — Chuẩn hóa hồ sơ ưu đãi & chi phí R&D:</b> Tập hợp thuyết minh dự án nghiên cứu, hóa đơn thiết bị thí nghiệm cho khoản khấu trừ bổ sung 200% và chứng từ dự án tại địa bàn ưu đãi thuế."},{"k":"p","t":"<b>04. Bước 4 — Quyết toán và chuyển lỗ đúng quy định:</b> Lập phụ lục chuyển lỗ theo mẫu quy định, chuyển lỗ liên tục tối đa 5 năm và đối chiếu số thuế tạm nộp 4 quý (đạt tối thiểu 80% số quyết toán năm)."},{"k":"h3","t":"🌐 HỆ THỐNG CỔNG TRA CỨU ĐIỆN TỬ CHÍNH THỨC CỦA NGÀNH THUẾ:"},{"k":"p","t":"• Cổng Thuế điện tử: <a href=\"https://thuedientu.gdt.gov.vn\" target=\"_blank\" rel=\"noopener\">thuedientu.gdt.gov.vn</a>"},{"k":"p","t":"• Cổng TTĐT Tổng cục Thuế: <a href=\"https://www.gdt.gov.vn\" target=\"_blank\" rel=\"noopener\">gdt.gov.vn</a>"},{"k":"p","t":"• Cổng Văn bản QPPL Chính phủ: <a href=\"https://vanban.chinhphu.vn\" target=\"_blank\" rel=\"noopener\">vanban.chinhphu.vn</a>"},{"k":"p","t":"• Tổng đài hỗ trợ Người nộp thuế: 1800 1567 / (024) 39712555"}]}],"refs":{"st_1":[{"targetSlug":"nd320","targetAnchor":"nd320_4","label":"Căn cứ → NĐ 320 Điều 4 (bổ sung bởi NĐ 141)","description":"Quy định miễn thuế DN siêu nhỏ doanh thu ≤ 1 tỷ đồng"},{"targetSlug":"nd320","targetAnchor":"nd320_2","label":"Căn cứ → NĐ 320 Điều 2","description":"Tiêu chuẩn người nộp thuế và doanh nghiệp siêu nhỏ"}],"st_2":[{"targetSlug":"nd320","targetAnchor":"nd320_4","label":"Căn cứ → NĐ 320 Điều 4 (bổ sung bởi NĐ 141)","description":"Quy định miễn thuế DN siêu nhỏ doanh thu ≤ 1 tỷ đồng"},{"targetSlug":"nd320","targetAnchor":"nd320_2","label":"Căn cứ → NĐ 320 Điều 2","description":"Tiêu chuẩn người nộp thuế và doanh nghiệp siêu nhỏ"}],"st_3":[{"targetSlug":"nd320","targetAnchor":"nd320_4","label":"Căn cứ → NĐ 320 Điều 4 (bổ sung bởi NĐ 141)","description":"Quy định miễn thuế DN siêu nhỏ
